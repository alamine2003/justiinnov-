# Pile de production. Aucun code n'est monté : tout vient des images publiées
# par la livraison continue, identifiées par `IMAGE_TAG` (le SHA du commit).
#
# Le fichier `.env` à côté fournit les secrets et le domaine ; voir
# `.env.example`. Seul Caddy est exposé : la base, le stockage et l'API ne
# sont joignables que depuis le réseau interne de la pile.
#
#   IMAGE_TAG=sha-… docker compose -f docker-compose.prod.yml up -d --wait
#
# Revenir en arrière consiste à relancer la même commande avec l'étiquette
# précédente : les migrations Django ne se défont pas seules, mais le code
# d'une version N-1 sait lire le schéma de N tant que la migration n'a fait
# qu'ajouter.
#
# Aucun service ne lit `.env` en bloc (`env_file`) : chaque variable
# transmise est nommée sous `environment`, service par service. Le `.env`
# porte aussi le mot de passe de Grafana, l'adresse ACME ou le jeton de
# registre, qui n'ont rien à faire dans l'environnement d'un processus
# Django — ni dans son `/proc/<pid>/environ`, ni dans `docker inspect`.
# Conséquence : une variable qui n'est pas listée ici n'atteint pas le
# service, même posée dans `.env`.
#
# Une surcharge locale (docker-compose.override.yml, non versionnée) se
# déclare par `COMPOSE_FILE=docker-compose.prod.yml:docker-compose.override.yml`
# dans `.env` ; deploy.sh et restaurer.sh la respectent (README.md,
# « Surcharge locale »).
#
# La supervision (Prometheus, exporteurs, Grafana) est un profil Compose
# optionnel, `supervision` : `SUPERVISION=1` dans `.env` l'active — deploy.sh
# et restaurer.sh en déduisent COMPOSE_PROFILES, Caddy ouvre /grafana/, le
# backend expose le drapeau `supervision` à l'interface. Sans lui, ces quatre
# services n'existent pas pour Compose et /grafana/ répond 404 (README.md,
# « Supervision »).

# Les limites de mémoire (`mem_limit`) sont dimensionnées pour une machine de
# 4 Go : la plateforme elle-même reste sous 3 Go, sauvegardes comprises ; la
# supervision (Prometheus, Grafana, exporteurs), quand elle est activée,
# ajoute 640 Mo de plafond — 8 Go sont alors plus confortables. Un service
# qui dépasse sa limite est tué et relancé par `restart`, plutôt que
# d'emporter la machine avec lui.

# Deux rôles Postgres : le propriétaire (POSTGRES_MIGRATION_USER, sinon
# POSTGRES_USER) initialise la base, joue les migrations et fait les
# sauvegardes ; le service tourne avec POSTGRES_USER. Tant que
# creer_role_applicatif.sql n'a pas été joué, les deux sont le même rôle.
x-proprietaire: &proprietaire
  PGHOST: db
  PGDATABASE: ${POSTGRES_DB:-justi_innov}
  PGUSER: ${POSTGRES_MIGRATION_USER:-${POSTGRES_USER:-justi}}
  PGPASSWORD: ${POSTGRES_MIGRATION_PASSWORD:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}}

# Journaux bornés sur chaque service : 100 Mo au plus par conteneur, pour
# qu'un service bavard ne remplisse pas le disque que partagent la base et
# les sauvegardes.
x-journal: &journal
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

# Environnement Django, commun au serveur et à l'ordonnanceur. Les valeurs
# par défaut reprennent celles de `backend/config/settings.py` et de
# `backend/entrypoint.sh` : une variable absente du `.env` arrive vide et
# Django ne verrait pas la différence avec une valeur voulue.
x-django: &django
  # --- Django ---
  DJANGO_DEBUG: "0"
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY manquant}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?DJANGO_ALLOWED_HOSTS manquant}
  DJANGO_TIME_ZONE: ${DJANGO_TIME_ZONE:-UTC}
  DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-1}
  DJANGO_HSTS_PRELOAD: ${DJANGO_HSTS_PRELOAD:-1}
  # Caddy puis nginx : deux proxys de confiance devant Django.
  DJANGO_NUM_PROXIES: ${DJANGO_NUM_PROXIES:-2}
  DJANGO_HSTS_SECONDS: ${DJANGO_HSTS_SECONDS:-0}
  DJANGO_TOTP_REQUIRED: ${DJANGO_TOTP_REQUIRED:-0}
  DJANGO_CREATE_SUPERUSER: ${DJANGO_CREATE_SUPERUSER:-0}
  DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
  DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
  DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS manquant}
  APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL manquant}
  ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-innovpharma.net}
  TOKEN_MAX_AGE_DAYS: ${TOKEN_MAX_AGE_DAYS:-30}
  # --- Base : le rôle applicatif ; le propriétaire pour les migrations ---
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-justi_innov}
  POSTGRES_USER: ${POSTGRES_USER:-justi}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
  POSTGRES_MIGRATION_USER: ${POSTGRES_MIGRATION_USER:-}
  # Le mot de passe du propriétaire n'est pas dans l'environnement : il
  # est lu dans ce fichier, un secret Compose alimenté par
  # POSTGRES_MIGRATION_PASSWORD du .env (voir `secrets`, en bas).
  POSTGRES_MIGRATION_PASSWORD_FILE: /run/secrets/postgres_migration_password
  DATABASE_URL: ${DATABASE_URL:-}
  DATABASE_MIGRATION_URL: ${DATABASE_MIGRATION_URL:-}
  # --- Cache principal ---
  # Videz cette variable et la base de données reprend le rôle : la pile
  # démarre sans Redis. Le serveur et l'ordonnanceur doivent pointer sur le
  # même cache — la configuration du circuit y est gardée sans expiration,
  # et c'est le serveur qui l'invalide quand elle change.
  REDIS_URL: ${REDIS_URL-redis://redis:6379/0}
  # --- Cette machine, vue de dehors ---
  # Vide, /api/health/ ne dit rien de plus. Renseigné (« 1 », « 2 »), il dit
  # quelle machine a répondu derrière un nom de domaine partagé : pendant une
  # bascule, c'est la seule façon de voir l'aiguillage changer de machine.
  SERVEUR_NOM: ${SERVEUR_NOM:-}
  # --- Surveillance des erreurs ---
  # Vide : rien ne s'installe, rien ne sort, aucune dépendance réseau de
  # plus. Renseigner l'adresse est une décision — une donnée de la plateforme
  # part alors chez un tiers ; ce qui part, et surtout ce qui ne part pas, est
  # réglé dans `backend/config/surveillance.py`.
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
  # La version du code qui a produit l'erreur : l'étiquette des images.
  SENTRY_RELEASE: ${SENTRY_RELEASE:-${IMAGE_TAG:-}}
  # Mesure des performances : un second flux, plus gros que les erreurs, et
  # Prometheus la fait déjà sans rien faire sortir de la machine.
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
  # --- Stockage des justificatifs ---
  AWS_S3_ENDPOINT_URL: "http://minio:9000"
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID manquant}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY manquant}
  AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-justificatifs}
  # --- Courrier ---
  # Courrier coupé par défaut (décision 88) ; 1 le rouvre.
  DJANGO_EMAIL_ENABLED: ${DJANGO_EMAIL_ENABLED:-0}
  EMAIL_HOST: ${EMAIL_HOST:-}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-1}
  EMAIL_BACKEND_CONSOLE: ${EMAIL_BACKEND_CONSOLE:-0}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:?DEFAULT_FROM_EMAIL manquant}
  # --- Serveur d'application ---
  GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
  GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
  GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  # --- Supervision ---
  # Le même drapeau que celui qui active le profil Compose : l'API
  # (/api/configuration/) le renvoie à l'interface, qui n'affiche l'entrée
  # « Supervision » que s'il vaut 1 — sinon le lien mènerait à un 404.
  SUPERVISION: ${SUPERVISION:-0}
  # --- Ordonnanceur ---
  SCHEDULE_EMAILS: ${SCHEDULE_EMAILS:-*/5 * * * *}
  SCHEDULE_SUPPRESSIONS: ${SCHEDULE_SUPPRESSIONS:-*/5 * * * *}
  SCHEDULE_VERIF_SAUVEGARDES: ${SCHEDULE_VERIF_SAUVEGARDES:-30 8 * * *}
  SCHEDULE_ALERTS: ${SCHEDULE_ALERTS:-0 * * * *}
  SCHEDULE_WEEKLY_REPORT: ${SCHEDULE_WEEKLY_REPORT:-0 7 * * 1}
  SCHEDULE_MONTHLY_REPORT: ${SCHEDULE_MONTHLY_REPORT:-0 7 1 * *}

x-backend: &backend
  image: ${BACKEND_IMAGE:?BACKEND_IMAGE manquant}:${IMAGE_TAG:?IMAGE_TAG manquant}
  secrets:
    - postgres_migration_password
  restart: unless-stopped
  logging: *journal

services:
  # Le volume `sauvegardes` est partagé par des processus qui n'ont pas le
  # même utilisateur : Postgres archive ses segments sous `postgres`
  # (archiver_wal.sh, appelé par la base elle-même), les services de
  # sauvegarde des pièces et de copie distante écrivent en root. Docker crée
  # un volume vide en root, 755 : Postgres ne pouvait pas y créer
  # `base/wal`, chaque archivage échouait, et les segments s'accumulaient
  # dans `pg_wal` jusqu'à remplir le disque — sans que rien ne le dise avant
  # le contrôle du lendemain matin. Ce service tourne une fois à chaque
  # `up`, avant la base, et donne à `postgres` ce qui lui revient : la racine
  # (pour ses marqueurs), `base/` et `.distant/`. Les pièces restent en root,
  # personne d'autre n'y écrit.
  sauvegardes-init:
    image: postgres:18.6-alpine
    user: root
    entrypoint: ["sh", "-ec"]
    command:
      - |
        mkdir -p /sauvegardes/base/wal /sauvegardes/base/physique /sauvegardes/.distant
        chown postgres:postgres /sauvegardes /sauvegardes/.distant
        chown -R postgres:postgres /sauvegardes/base
        chmod 700 /sauvegardes/base/wal
    volumes:
      - sauvegardes:/sauvegardes
    restart: "no"
    logging: *journal

  db:
    image: postgres:18.6-alpine
    # L'image officielle arrête Postgres en mode « fast » : les connexions
    # sont rompues, puis un point de reprise est écrit. C'est rapide sur une
    # base de cette taille, mais un SIGKILL au milieu obligerait au
    # rétablissement par le journal au redémarrage suivant — sans perte, la
    # durée en plus. Le double du délai par défaut coûte zéro quand tout va
    # bien, et évite cela quand la base est occupée.
    stop_grace_period: 30s
    # Postgres ne se règle pas seul : par défaut il suppose 128 Mo de cache
    # et n'en utilise pas plus. Un quart de sa limite en tampons partagés,
    # les trois quarts en estimation du cache disponible ; `shm_size` évite
    # l'échec des tris parallèles, que les 64 Mo de /dev/shm par défaut de
    # Docker font échouer.
    #
    # `max_connections` était laissé à son défaut, 100 : un plafond que
    # personne n'avait choisi, et que le `mem_limit: 1g` ci-dessous ne peut
    # pas honorer. Mesuré pendant l'audit de résilience : une connexion
    # coûte 1,9 à 2,4 Mo, sans compter `work_mem` (4 Mo par tri). Cent
    # connexions en train de trier dépasseraient le gigaoctet et feraient
    # tuer la base par le noyau — une panne bien pire qu'un refus de
    # connexion. Cinquante tient dans la limite et laisse le double de ce
    # que la pile consomme (voir POSTGRES_MAX_CONNECTIONS dans
    # `.env.example` pour le détail du budget).
    #
    # `archive_command` : chaque segment de journal rempli est copié hors de
    # `pg_wal` (archiver_wal.sh). C'est ce qui permet la reprise à un instant
    # donné — le dump de 02:00 dit où l'on était, les segments disent tout ce
    # qui s'est passé depuis. Sans eux, une panne à 01:59 perd la journée.
    #
    # La commande est écrite en **liste** et non en chaîne : `%p %f` et les
    # espaces de `archive_command` dépendraient sinon d'une découpe de shell,
    # et une erreur de guillemets ne se verrait qu'au premier segment perdu.
    #
    # `archive_timeout` borne ce qu'on risque quand le trafic est faible :
    # sans lui, un segment à moitié rempli attend d'être plein, et le travail
    # d'une soirée calme resterait hors de l'archive. Postgres ne force le
    # changement que s'il y a eu écriture : une base au repos ne produit rien.
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-50}
      - -c
      - archive_mode=${POSTGRES_ARCHIVE_MODE:-on}
      - -c
      - archive_command=/archiver_wal.sh %p %f
      - -c
      - archive_timeout=${POSTGRES_ARCHIVE_TIMEOUT:-300}
      # Réplique en attente chaude (docker-compose.replique.yml, sur une
      # seconde machine). Sans réplique déclarée, ces réglages ne coûtent
      # rien : aucun flux n'est ouvert.
      #
      # `max_slot_wal_keep_size` est **la** borne à ne pas retirer. Un
      # emplacement de réplication demande à la primaire de garder tout ce
      # que la réplique n'a pas encore lu ; si la seconde machine s'absente,
      # cela ne s'arrête jamais. Mesuré : sans borne, `pg_wal` grandit
      # jusqu'à remplir le disque — et la base s'arrête. Avec elle,
      # l'emplacement est déclaré perdu au-delà de la marge, la primaire
      # continue de servir, et c'est la réplique qu'on reconstruit (0,5 s
      # pour 15 Mo, mesuré). Perdre la réplique vaut mieux que perdre la
      # base.
      - -c
      - max_slot_wal_keep_size=${POSTGRES_SLOT_WAL_MAX:-2GB}
      - -c
      - max_wal_senders=${POSTGRES_WAL_SENDERS:-10}
    shm_size: 256m
    mem_limit: 1g
    # Le superutilisateur du conteneur est le rôle propriétaire : celui qui
    # existait avant creer_role_applicatif.sql, et qui garde le schéma.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-justi_innov}
      POSTGRES_USER: ${POSTGRES_MIGRATION_USER:-${POSTGRES_USER:-justi}}
      POSTGRES_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}}
      # Un segment contient les mêmes données qu'un dump : lignes, jetons,
      # secrets TOTP. S'il est demandé pour les dumps, il l'est ici aussi —
      # sinon l'archive serait le trou de la serrure.
      SAUVEGARDE_CLE_PUBLIQUE: ${SAUVEGARDE_CLE_PUBLIQUE:-}
      SAUVEGARDE_DESTINATION: /sauvegardes
    volumes:
      - pgdata:/var/lib/postgresql/data
      # À la première initialisation seulement : l'entrée de pg_hba.conf
      # qui laisse le service `sauvegarde` prendre la sauvegarde physique
      # (pg_basebackup ouvre une connexion de réplication, que l'image
      # n'autorise pas d'un autre conteneur). Un cluster déjà en service
      # reçoit la ligne à la main, une fois (README.md).
      - ./initdb:/docker-entrypoint-initdb.d:ro
      # L'archivage écrit dans le volume des sauvegardes : c'est Postgres
      # lui-même qui appelle le script, il faut donc que la base y accède.
      # En lecture seule pour le script, en écriture pour l'archive.
      - ./archiver_wal.sh:/archiver_wal.sh:ro
      - sauvegardes:/sauvegardes
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_MIGRATION_USER:-${POSTGRES_USER:-justi}} -d ${POSTGRES_DB:-justi_innov}"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      sauvegardes-init:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *journal

  redis:
    image: redis:8.0-alpine
    # Aucune persistance : un cache perdu se reconstruit, et un cache qu'on
    # sauvegarde coûte des écritures pour rien — c'est précisément ce qu'on
    # cherche à éviter. L'éviction porte sur la clé la moins récemment
    # utilisée : un compteur anti-bourrage qu'on vient de toucher est donc le
    # dernier à partir, là où la purge de `DatabaseCache` supprimait par
    # ordre alphabétique et l'emportait en premier (décision 69).
    command: >
      redis-server --save "" --appendonly no
      --maxmemory ${REDIS_MAXMEMORY:-128mb} --maxmemory-policy allkeys-lru
    mem_limit: 192m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *journal

  minio:
    # MinIO ne publie plus d'images (décision 94) : la livraison construit
    # `deploy/minio/Dockerfile` — mêmes versions de minio et de mc que les
    # images officielles d'avant — et la publie sur ghcr.io, à côté du
    # backend. L'étiquette ne bouge pas à chaque livraison : le conteneur
    # n'est recréé que lorsqu'elle change.
    image: ghcr.io/alamine2003/justiinnov--minio:RELEASE.2025-04-22T22-12-26Z-5c7b4d5b5aab
    command: server /data
    mem_limit: 512m
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID manquant}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY manquant}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging: *journal

  backend:
    <<: *backend
    mem_limit: 768m
    # Docker accorde dix secondes entre son SIGTERM et son SIGKILL, et
    # gunicorn en prend trente pour laisser finir les requêtes en vol
    # (`--graceful-timeout 30`, backend/entrypoint.sh) — trente parce que
    # `GUNICORN_TIMEOUT` vaut 120 : un export d'année complète ou une pièce
    # de 20 Mo sur une liaison lente dépassent les trente secondes par
    # défaut. Sans ce réglage, la chaîne se contredisait : 120 s autorisées,
    # 30 s pour se vider, 10 s réellement accordées. Mesuré pendant l'audit
    # de résilience — une pièce en cours de dépôt mettait 11,07 s à finir
    # après le SIGTERM, soit une seconde de trop : à chaque livraison, le
    # déposant perdait son envoi. Cinq secondes de marge pour que gunicorn
    # sorte de lui-même plutôt que d'être abattu.
    stop_grace_period: 35s
    environment:
      <<: *django
      # Compteurs Prometheus partagés entre les workers gunicorn, en mémoire
      # partagée ; l'entrypoint vide le dossier à chaque démarrage. Propre au
      # serveur : l'ordonnanceur, processus unique, ne le reçoit pas — il
      # écrirait ses propres compteurs au milieu de ceux du serveur.
      PROMETHEUS_MULTIPROC_DIR: ${PROMETHEUS_MULTIPROC_DIR:-/dev/shm/prometheus}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  scheduler:
    <<: *backend
    mem_limit: 256m
    environment:
      <<: *django
      # Marqueurs de réussite des sauvegardes (sauvegarder.sh), lus par
      # `manage.py verifier_sauvegardes` : une sauvegarde qui manque ou
      # vieillit devient une notification aux administrateurs.
      SAUVEGARDES_MARQUEURS: /sauvegardes
    entrypoint: ["python", "manage.py", "run_scheduler"]
    volumes:
      # En lecture seule : l'ordonnanceur lit les marqueurs, il n'écrit
      # jamais dans les sauvegardes.
      - sauvegardes:/sauvegardes:ro
    # L'image hérite du contrôle de santé du backend, qui interroge l'API sur
    # le port 8000 : l'ordonnanceur n'y répond pas et serait déclaré mort.
    # Le sien lit le battement de cœur que `run_scheduler` touche chaque
    # minute (core/management/commands/run_scheduler.py) : plus de trois
    # minutes sans battement, la boucle est bloquée. Le désactiver n'est pas
    # une option : `docker compose up --wait` refuse un service sans contrôle
    # de santé, et la livraison s'arrêtait là.
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(0 if time.time() - os.stat('/tmp/scheduler.battement').st_mtime < 180 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE manquant}:${IMAGE_TAG:?IMAGE_TAG manquant}
    mem_limit: 64m
    restart: unless-stopped
    logging: *journal
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    image: caddy:2.11-alpine
    mem_limit: 128m
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN manquant}
      # Obligatoire : vide, la directive `email` du Caddyfile est mal formée
      # et Caddy refuse de démarrer — donc la plateforme entière.
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL manquant}
      # Route /grafana/ vers Grafana si 1, répond 404 sinon (Caddyfile).
      SUPERVISION: ${SUPERVISION:-0}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # Pas de dépendance sur grafana : il est dans un profil optionnel, et
    # Caddy résout `grafana:3000` à la requête, pas au démarrage.
    depends_on:
      - frontend
    restart: unless-stopped
    logging: *journal

  # Sauvegardes nocturnes (sauvegarder.sh) dans le volume `sauvegardes` :
  # un `pg_dump -Fc` par nuit, gardé 30 jours, plus une copie mensuelle
  # conservée pour toujours, et un miroir du bucket des justificatifs. Trois
  # services parce que trois outils : pg_dump vient de l'image postgres, mc
  # de notre image minio (décision 94), et rclone de la sienne pour la copie hors machine
  # (`sauvegarde-distante`, plus bas), sans laquelle une sauvegarde brûle
  # avec le serveur ; restaurer.sh fait le chemin inverse. Chacun ne reçoit
  # que ce qu'il lui faut : la base pour l'un, le stockage pour l'autre, le
  # distant pour le troisième — pas la clé Django ni le mot de passe de
  # Grafana. SAUVEGARDE_DISTANT_ENDPOINT est donné aux deux premiers pour
  # une seule raison : dire dans leur journal, où l'exploitation regarde,
  # qu'aucune copie hors machine n'est configurée.
  sauvegarde:
    image: postgres:18.6-alpine
    mem_limit: 128m
    # Sous `postgres`, comme l'archivage : les dumps, les sauvegardes
    # physiques et la purge des segments se font alors dans des répertoires
    # qui appartiennent au même utilisateur que celui qui y archive. C'est
    # aussi l'utilisateur qu'exige `pg_ctl`, dont la reprise (service
    # `reprise`, plus bas) a besoin ; root, il refuse.
    user: postgres
    entrypoint: ["/sauvegarder.sh", "base"]
    environment:
      <<: *proprietaire
      # Base hébergée hors de la pile : pg_dump accepte l'URL.
      DATABASE_URL: ${DATABASE_URL:-}
      SAUVEGARDE_HEURE: ${SAUVEGARDE_HEURE:-02:00}
      SAUVEGARDE_RETENTION_JOURS: ${SAUVEGARDE_RETENTION_JOURS:-30}
      SAUVEGARDE_DISTANT_ENDPOINT: ${SAUVEGARDE_DISTANT_ENDPOINT:-}
      # Chiffrement à clé publique des dumps, sur place : le certificat est
      # public, la clé privée reste hors du serveur (.env.example).
      SAUVEGARDE_CLE_PUBLIQUE: ${SAUVEGARDE_CLE_PUBLIQUE:-}
    volumes:
      - ./sauvegarder.sh:/sauvegarder.sh:ro
      - ./creer_role_applicatif.sql:/creer_role_applicatif.sql:ro
      - sauvegardes:/sauvegardes
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *journal

  # Reprise à un instant donné (restaurer_a_la_date.sh). C'est le seul
  # service, avec la base, qui voit le répertoire de données : le mode
  # --en-production le remplace. Il n'est jamais lancé par `up` — le profil
  # `reprise` n'est activé que par `docker compose run --rm reprise …`, et le
  # conteneur disparaît avec la commande. La base d'essai du mode --essai
  # démarre à l'intérieur, sous `postgres`, avec ce qu'un Postgres a besoin
  # de mémoire ; 128 Mo ne lui suffiraient pas.
  reprise:
    image: postgres:18.6-alpine
    profiles: ["reprise"]
    user: postgres
    mem_limit: 512m
    shm_size: 256m
    entrypoint: ["/restaurer_a_la_date.sh"]
    environment:
      <<: *proprietaire
      SAUVEGARDE_DESTINATION: /sauvegardes
      # La clé privée n'est pas sur le serveur : le jour d'une reprise de
      # segments chiffrés, elle est apportée sur la ligne de commande
      # (README.md, « Reprise à un instant donné »).
      SAUVEGARDE_CLE_PRIVEE: ${SAUVEGARDE_CLE_PRIVEE:-}
    volumes:
      - ./restaurer_a_la_date.sh:/restaurer_a_la_date.sh:ro
      - sauvegardes:/sauvegardes
      - pgdata:/var/lib/postgresql/data
    logging: *journal

  sauvegarde-pieces:
    # La même image que `minio`, qui porte aussi `mc` (décision 94).
    image: ghcr.io/alamine2003/justiinnov--minio:RELEASE.2025-04-22T22-12-26Z-5c7b4d5b5aab
    mem_limit: 128m
    entrypoint: ["/sauvegarder.sh", "pieces"]
    environment:
      AWS_S3_ENDPOINT_URL: "http://minio:9000"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID manquant}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY manquant}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-justificatifs}
      # Un quart d'heure après la base, pour ne pas charger le disque deux
      # fois en même temps.
      SAUVEGARDE_HEURE: ${SAUVEGARDE_PIECES_HEURE:-02:15}
      SAUVEGARDE_DISTANT_ENDPOINT: ${SAUVEGARDE_DISTANT_ENDPOINT:-}
    volumes:
      - ./sauvegarder.sh:/sauvegarder.sh:ro
      - sauvegardes:/sauvegardes
    depends_on:
      minio:
        condition: service_healthy
    restart: unless-stopped
    logging: *journal

  # Copie hors machine, obligatoire avant toute mise en production
  # (docs/model-de-donnees.md, décision 36) : chaque dump réussi et le
  # miroir des pièces partent vers un stockage objet S3 compatible
  # (SAUVEGARDE_DISTANT_*), où ils sont vérifiés (`rclone check`). Le
  # service guette les demandes que déposent les deux autres dans le volume
  # après chaque sauvegarde réussie, et écrit « ✔ copie distante » ou « ✘ »
  # dans son journal. Sans SAUVEGARDE_DISTANT_ENDPOINT, il tourne quand
  # même — pour le dire, au démarrage et à chaque sauvegarde. Étiquette
  # épinglée, comme les autres. Le secret du distant passe par un secret
  # Compose, pas par l'environnement.
  sauvegarde-distante:
    image: rclone/rclone:1.72.0
    # rclone : ~50 Mo au repos, plus ~32 Mo de tampons d'envoi
    # (sauvegarder.sh borne transferts, morceaux et concurrence).
    mem_limit: 128m
    entrypoint: ["/sauvegarder.sh", "distant"]
    environment:
      SAUVEGARDE_DISTANT_ENDPOINT: ${SAUVEGARDE_DISTANT_ENDPOINT:-}
      SAUVEGARDE_DISTANT_BUCKET: ${SAUVEGARDE_DISTANT_BUCKET:-}
      SAUVEGARDE_DISTANT_CLE: ${SAUVEGARDE_DISTANT_CLE:-}
      SAUVEGARDE_DISTANT_REGION: ${SAUVEGARDE_DISTANT_REGION:-}
      SAUVEGARDE_DISTANT_FOURNISSEUR: ${SAUVEGARDE_DISTANT_FOURNISSEUR:-Other}
      # La même rétention que sur la machine, appliquée au préfixe
      # quotidien/ du distant ; mensuel/ n'est jamais touché — et seulement
      # si SAUVEGARDE_DISTANT_ROTATION=1 : par défaut le serveur n'efface
      # rien là-bas, c'est la règle de cycle de vie du bucket qui le fait.
      SAUVEGARDE_RETENTION_JOURS: ${SAUVEGARDE_RETENTION_JOURS:-30}
      SAUVEGARDE_DISTANT_ROTATION: ${SAUVEGARDE_DISTANT_ROTATION:-0}
      # Sel du chiffrement (facultatif) ; la clé, elle, passe par un secret.
      SAUVEGARDE_CHIFFREMENT_SEL: ${SAUVEGARDE_CHIFFREMENT_SEL:-}
      SAUVEGARDE_DISTANT_EN_CLAIR: ${SAUVEGARDE_DISTANT_EN_CLAIR:-0}
    secrets:
      - sauvegarde_distant_secret
      - sauvegarde_chiffrement_cle
    volumes:
      - ./sauvegarder.sh:/sauvegarder.sh:ro
      - sauvegardes:/sauvegardes
    restart: unless-stopped
    logging: *journal

  # --- Supervision : Prometheus → Grafana, sur https://<domaine>/grafana/ ---
  #
  # Profil Compose `supervision`, optionnel : activé par SUPERVISION=1 dans
  # .env (deploy.sh et restaurer.sh en déduisent COMPOSE_PROFILES ; pour
  # `docker compose` lancé à la main, `COMPOSE_PROFILES=supervision` dans
  # .env aussi). Sans le profil, ces quatre services n'existent pas :
  # `compose config --services` ne les liste pas, `up` ne les lance pas, et
  # une machine de 4 Go garde ses 640 Mo. L'exploitation l'active quand
  # elle en a besoin ; deploy.sh arrête les quatre s'il trouve le drapeau
  # à 0 alors qu'ils tournent.
  #
  # Prometheus collecte toutes les 15 s les compteurs du backend
  # (django-prometheus, sous le jeton METRICS_TOKEN), ceux de la base
  # (postgres-exporter) et ceux du serveur (node-exporter) ; Grafana les
  # affiche sur le tableau de bord provisionné depuis grafana/dashboards/.
  # Rien de tout cela n'est exposé : seul Caddy sert Grafana, sur le
  # sous-chemin /grafana/, et Grafana demande un mot de passe.
  prometheus:
    image: prom/prometheus:v2.53.5
    profiles: ["supervision"]
    mem_limit: 256m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Les mesures ne sont pas des données métier : 90 jours suffisent à
      # comparer un mois à l'autre, et le plafond en taille protège le disque
      # que partagent la base et les sauvegardes.
      - --storage.tsdb.retention.time=90d
      - --storage.tsdb.retention.size=2GB
      # Pas de `--web.enable-lifecycle` : il ouvrirait, sans
      # authentification, un point qui recharge ou arrête Prometheus à
      # quiconque joint le réseau interne. Recharger la configuration se
      # fait par un signal : `docker compose kill -s HUP prometheus`.
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    # Le jeton du backend arrive par un secret Compose, lu depuis METRICS_TOKEN
    # du .env, monté dans /run/secrets/metrics_token : il ne figure ni dans la
    # configuration ni dans la ligne de commande.
    secrets:
      - metrics_token
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging: *journal

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    profiles: ["supervision"]
    mem_limit: 64m
    environment:
      # Le rôle applicatif suffit : les vues pg_stat_* se lisent sans
      # privilège. Avec une base hors de la pile (DATABASE_URL), remplacez
      # ces trois variables par DATA_SOURCE_NAME=<l'URL> dans un fichier
      # docker-compose.override.yml.
      DATA_SOURCE_URI: "db:5432/${POSTGRES_DB:-justi_innov}?sslmode=disable"
      DATA_SOURCE_USER: ${POSTGRES_USER:-justi}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
      PG_EXPORTER_DISABLE_DEFAULT_METRICS: "false"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *journal

  node-exporter:
    image: prom/node-exporter:v1.9.1
    profiles: ["supervision"]
    mem_limit: 64m
    # Lit /proc, /sys et les systèmes de fichiers de l'hôte, en lecture
    # seule : c'est le seul service qui regarde hors de la pile.
    pid: host
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($$|/)
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped
    logging: *journal

  grafana:
    image: grafana/grafana:12.1.1
    profiles: ["supervision"]
    mem_limit: 256m
    environment:
      # Servi sous /grafana/ derrière Caddy, qui transmet le préfixe :
      # Grafana doit connaître son adresse publique pour construire ses
      # liens et servir lui-même le sous-chemin.
      GF_SERVER_ROOT_URL: "https://${APP_DOMAIN:?APP_DOMAIN manquant}/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # Exigé même profil inactif : Compose interpole toute la pile avant
      # d'appliquer les profils. Un vide ferait démarrer Grafana avec son
      # mot de passe par défaut le jour de l'activation.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD manquant}
      # Trois comptes, créés par l'administrateur (README.md, « Supervision ») :
      # « direction » (Viewer), « technique » (Editor) et l'administrateur
      # lui-même. Pas d'inscription, pas d'accès anonyme, et rien ne part
      # vers grafana.com. Un Viewer ne modifie rien, pas même « pour voir ».
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_VIEWERS_CAN_EDIT: "false"
      GF_USERS_EDITORS_CAN_ADMIN: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Le tableau de bord provisionné accueille chacun à la connexion, dans
      # le thème et la langue de l'application ; personne n'a à le chercher.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/justi-innov.json
      GF_USERS_DEFAULT_THEME: light
      GF_USERS_DEFAULT_LANGUAGE: fr-FR
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_SECURITY_COOKIE_SECURE: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      prometheus:
        condition: service_healthy
    restart: unless-stopped
    logging: *journal

volumes:
  pgdata:
  miniodata:
  caddy_data:
  caddy_config:
  sauvegardes:
  prometheus_data:
  grafana_data:

# Secrets Compose : la valeur vient du `.env`, atterrit dans un fichier sous
# /run/secrets du seul service qui le monte, et n'apparaît ni dans
# `docker inspect` ni dans l'environnement des autres processus. Une
# variable absente donne un fichier vide, ce qui est le cas attendu tant que
# creer_role_applicatif.sql n'a pas été joué.
secrets:
  metrics_token:
    environment: METRICS_TOKEN
  postgres_migration_password:
    environment: POSTGRES_MIGRATION_PASSWORD
  sauvegarde_distant_secret:
    environment: SAUVEGARDE_DISTANT_SECRET
  sauvegarde_chiffrement_cle:
    environment: SAUVEGARDE_CHIFFREMENT_CLE
