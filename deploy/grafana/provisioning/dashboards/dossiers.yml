# Tableaux de bord provisionnés depuis le dépôt, en deux dossiers :
#
# - Supervision : la santé de la plateforme (Prometheus), tenu à la main —
#   modifiez-le dans Grafana, exportez-le (Share › Export) et remplacez
#   `dashboards/supervision/justi-innov.json` ;
# - Pilotage : les chiffres des filiales (schéma `bi` de PostgreSQL,
#   décision 122), produits par `deploy/grafana/pilotage.py` — on modifie
#   le générateur, jamais le JSON.
#
# Une modification faite dans l'interface est écrasée au redémarrage
# (`allowUiUpdates: false`) : le dépôt fait foi.
apiVersion: 1

providers:
  - name: supervision
    folder: Supervision
    folderUid: supervision
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana/dashboards/supervision
      foldersFromFilesStructure: false
  - name: pilotage
    folder: Pilotage
    folderUid: pilotage
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana/dashboards/pilotage
      foldersFromFilesStructure: false
