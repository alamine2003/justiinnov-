# Intégration continue : tout ce qui doit être vrai avant de livrer.
#
# Deux workflows faisaient la même chose avec des réglages différents (Node 22
# ou 24, DEBUG à 0 ou à 1, le contrôle `check --deploy` dans l'un seulement).
# Il n'en reste qu'un, réutilisable : la livraison continue (`cd.yml`)
# l'appelle avant de construire la moindre image, si bien qu'un correctif
# ne part jamais sans que sa suite ait tourné. Il ne se déclenche donc pas
# lui-même sur `main` : une poussée y lancerait la CI deux fois, une fois
# seule et une fois dans la livraison.
#
# Les travaux sont indépendants : un échec de lint ne masque pas un échec de
# test, et l'on voit d'un coup d'œil ce qui est cassé.
#
# Les actions tierces sont épinglées par SHA complet, la version en
# commentaire : une étiquette comme `v4` est mutable, et un dépôt d'action
# compromis peut la faire pointer où il veut (incident tj-actions, mars
# 2025). Dependabot (`.github/dependabot.yml`) met les SHA à jour.
name: Intégration continue

on:
  pull_request:
  workflow_call:

# Lecture seule : ce workflow ne publie rien. Appelé par `cd.yml`, il ne peut
# de toute façon pas obtenir plus que l'appelant ne lui accorde.
permissions:
  contents: read

# Une poussée sur une PR annule la vérification de la poussée précédente :
# son résultat n'intéresse plus personne. Appelé par la livraison continue,
# `github.workflow` et `github.ref` sont ceux de l'appelant : le groupe
# devient « ci-Livraison continue-refs/heads/main », distinct du groupe
# « cd-<environnement> » de l'appelant, et sans annulation.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend — migrations, contrôles de déploiement, tests
    runs-on: ubuntu-latest

    services:
      db:
        # La même version qu'en production (deploy/docker-compose.prod.yml).
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: justi_innov
          POSTGRES_USER: justi
          POSTGRES_PASSWORD: justi
        options: >-
          --health-cmd "pg_isready -U justi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: justi_innov
      POSTGRES_USER: justi
      POSTGRES_PASSWORD: justi
      # La clé n'a pas à être un secret : la CI ne sert aucune donnée réelle.
      # Elle doit en revanche être longue et variée, sans quoi `check --deploy`
      # la refuse — et c'est bien cette configuration-là qu'on veut vérifier.
      # DEBUG reste à 0, pour tester ce qui sera déployé.
      DJANGO_SECRET_KEY: ci-7QmX2vLp9BdTnRw4KsZjHy6FgUcAe3NoIrVtPlMqDbXhJf5Ez
      DJANGO_DEBUG: "0"
      # `testserver` est l'hôte que le client de test de Django présente.
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      # La redirection HTTPS est une affaire de déploiement : le client de
      # test parle en clair, et sans cela chaque requête répondrait 301 au
      # lieu d'exécuter la vue. Le réglage de production reste vérifié par
      # l'étape `check --deploy`, qui tourne, elle, avec la redirection
      # active.
      DJANGO_SECURE_SSL_REDIRECT: "0"
      # Aucun stockage objet : les tests écrivent en mémoire.
      AWS_S3_ENDPOINT_URL: ""
      # Hors mode debug, un EMAIL_HOST absent est une erreur de
      # configuration (les alertes se perdraient) ; la CI n'a pas de SMTP et
      # l'acquitte explicitement : les messages vont dans la sortie.
      EMAIL_BACKEND_CONSOLE: "1"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Installer les dépendances
        working-directory: backend
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends gettext
          pip install -r requirements.txt

      - name: Compiler les traductions
        working-directory: backend
        # Le `.mo` n'est pas versionné : sans cette étape, les tests qui
        # lisent une réponse en anglais verraient le français, et un
        # catalogue mal formé ne serait découvert qu'au build de l'image.
        run: django-admin compilemessages -l en -v0

      - name: Vérifier que le catalogue anglais est complet
        working-directory: backend
        # Une chaîne ajoutée au code sans traduction ne fait échouer aucun
        # test — le français sert de repli — et sort en français à qui
        # demande l'anglais. `makemessages` ramène d'abord dans le catalogue
        # unique (décision 42) toute chaîne nouvelle du code, avec un
        # `msgstr` vide ; `msgfmt --check` refuse un catalogue mal formé ;
        # `msgattrib` isole ce qui reste vide ou douteux (fuzzy) et ne doit
        # rien rendre.
        run: |
          po=locale/en/LC_MESSAGES/django.po
          python manage.py makemessages -l en --ignore=tests --no-obsolete --no-wrap -v0
          msgfmt --check --statistics -o /dev/null "$po"
          manquantes="$(msgattrib --untranslated --no-wrap "$po"; msgattrib --only-fuzzy --no-wrap "$po")"
          if [ -n "$manquantes" ]; then
            printf '%s\n' "$manquantes"
            echo "::error::Des chaînes du serveur n'ont pas de traduction anglaise : complétez backend/$po (msgstr vides ou fuzzy ci-dessus)."
            exit 1
          fi

      - name: Vérifier qu'aucune migration ne manque
        working-directory: backend
        # Un modèle modifié sans migration passe les tests et casse au
        # déploiement : c'est le genre d'oubli qu'on ne voit qu'en production.
        run: python manage.py makemigrations --check --dry-run

      - name: Contrôles de déploiement Django
        working-directory: backend
        env:
          DJANGO_SECURE_SSL_REDIRECT: "1"
        run: python manage.py check --deploy --fail-level WARNING

      - name: Schéma d'API
        working-directory: backend
        # Le contrat d'API est généré depuis le code et versionné dans
        # `docs/api/schema.json` : une vue ou un sérialiseur modifié sans
        # régénération (`cd frontend && npm run types:api -- --schema`)
        # laisserait le frontend typer une réponse qui n'existe plus. La
        # génération échoue sur tout avertissement : un champ calculé sans
        # `@extend_schema_field` serait typé `string` par défaut.
        # Sur la sortie standard, comme `frontend/scripts/generer-types.mts` :
        # `--file` n'écrit pas la dernière fin de ligne, et le diff échouerait
        # sur ce seul octet.
        run: |
          python manage.py spectacular --format openapi-json --validate --fail-on-warn > "$RUNNER_TEMP/schema.json"
          if ! diff -u ../docs/api/schema.json "$RUNNER_TEMP/schema.json"; then
            echo "::error::docs/api/schema.json ne correspond plus au code : lancez « cd frontend && npm run types:api -- --schema » et commitez le résultat."
            exit 1
          fi

      - name: Tests
        working-directory: backend
        # Une seule suite à la fois sur cette base : Django crée
        # `test_justi_innov` (et un clone par processus sous `--parallel`)
        # et les détruit à la fin, deux suites en parallèle se marcheraient
        # dessus. Le cache de test est en mémoire, propre à chaque processus
        # (voir « Réglages de test » dans config/settings.py).
        run: python manage.py test --verbosity=2 --noinput --parallel auto

  frontend:
    name: Frontend — types, lint, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # La même version que l'image de production (`frontend/Dockerfile`).
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Schéma d'API
        # `src/lib/types.generated.ts` est tiré de `docs/api/schema.json`
        # (lui-même comparé au code dans le travail backend) : régénéré ici,
        # il doit être identique au fichier versionné.
        run: |
          npm run types:api
          if ! git diff --exit-code -- src/lib/types.generated.ts; then
            echo "::error::src/lib/types.generated.ts ne correspond plus à docs/api/schema.json : lancez « npm run types:api » et commitez le résultat."
            exit 1
          fi

      - name: Types
        run: npx tsc -b --force

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

  images:
    name: Images Docker
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Le conteneur frontend a déjà été cassé par un Dockerfile qui
      # construisait la mauvaise cible : la construction fait partie de la
      # vérification, pas seulement les tests. Le cache est partagé avec la
      # livraison continue, qui reconstruit les mêmes couches.
      - name: Construire l'image backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Construire l'image frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          target: runtime
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      # Une seule étiquette pour l'image MinIO construite chez nous
      # (décision 94) : le poste de développement, la CI et le serveur font
      # tourner le même binaire, et la livraison publie ce que tire le
      # serveur.
      - name: Une seule étiquette pour l'image MinIO
        run: |
          etiquettes="$(grep -h '^ *image: ghcr\.io/[^ ]*-minio:' docker-compose.yml deploy/docker-compose.prod.yml | sed 's/^ *image: //' | sort -u)"
          echo "$etiquettes"
          if [ -z "$etiquettes" ] || [ "$(printf '%s\n' "$etiquettes" | wc -l)" -ne 1 ]; then
            echo "::error::docker-compose.yml et deploy/docker-compose.prod.yml doivent nommer la même image MinIO"
            exit 1
          fi
          # L'étiquette finit par l'empreinte du Dockerfile : la livraison ne
          # republie pas une étiquette existante, et un Dockerfile modifié
          # sous la même étiquette ne partirait jamais en production.
          empreinte="$(sha256sum deploy/minio/Dockerfile | cut -c1-12)"
          case "$etiquettes" in
            *"-$empreinte") ;;
            *)
              echo "::error::deploy/minio/Dockerfile a changé : l'étiquette de l'image MinIO doit finir par -$empreinte, dans docker-compose.yml et deploy/docker-compose.prod.yml"
              exit 1
              ;;
          esac
          if grep -nE '^ *image: *(quay\.io/minio|minio)/' docker-compose.yml deploy/*.yml; then
            echo "::error::une image MinIO officielle est encore tirée : elles ne sont plus publiées"
            exit 1
          fi

      - name: Construire l'image MinIO
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/minio
          push: false
          cache-from: type=gha,scope=minio
          cache-to: type=gha,scope=minio,mode=max

  parcours:
    name: Parcours complet — pile Docker et captures
    runs-on: ubuntu-latest
    # Les tests unitaires ne voient pas un proxy nginx mal réglé, une image
    # qui ne démarre pas ou une page qui plante au montage. Ce travail lance
    # la pile telle qu'elle sera livrée (backend en mode production, frontend
    # servi par nginx), y crée des comptes jetables, et rejoue les scripts de
    # capture de DESIGN.md — qui échouent à la moindre erreur de console.
    #
    # Les images sont reconstruites ici par `docker compose --build`, avec le
    # constructeur local : le cache buildx du travail « Images Docker »
    # (type=gha) n'est pas réutilisé. Le faire demanderait de construire
    # avec `docker/build-push-action` en `load: true` puis de nommer les
    # images dans docker-compose.ci.yml ; le gain (deux ou trois minutes)
    # n'a pas encore justifié la double définition.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances et Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Générer des comptes jetables
        # Les mots de passe et les secrets de double authentification sont
        # tirés au sort à chaque exécution et masqués dans les journaux :
        # rien de réutilisable ne sort d'ici. Les secrets (base32, 20 octets)
        # sont donnés à l'amorçage comme déjà enrôlés, et aux scripts de
        # capture pour calculer le code à la connexion. Le pays est africain,
        # faute de quoi l'amorçage le refuserait.
        run: |
          HQ_PASSWORD="Ci-$(openssl rand -hex 12)"
          COUNTRY_PASSWORD="Ci-$(openssl rand -hex 12)"
          HQ_TOTP_SECRET="$(python3 -c "import secrets,base64; print(base64.b32encode(secrets.token_bytes(20)).decode())")"
          COUNTRY_TOTP_SECRET="$(python3 -c "import secrets,base64; print(base64.b32encode(secrets.token_bytes(20)).decode())")"
          echo "::add-mask::$HQ_PASSWORD"
          echo "::add-mask::$COUNTRY_PASSWORD"
          echo "::add-mask::$HQ_TOTP_SECRET"
          echo "::add-mask::$COUNTRY_TOTP_SECRET"
          echo "SHOT_HQ_PASSWORD=$HQ_PASSWORD" >> "$GITHUB_ENV"
          echo "SHOT_COUNTRY_PASSWORD=$COUNTRY_PASSWORD" >> "$GITHUB_ENV"
          echo "SHOT_HQ_TOTP_SECRET=$HQ_TOTP_SECRET" >> "$GITHUB_ENV"
          echo "SHOT_COUNTRY_TOTP_SECRET=$COUNTRY_TOTP_SECRET" >> "$GITHUB_ENV"
          cat > backend/seed_users.ci.json <<EOF
          {
            "countries": [
              {
                "country_ref": "TG-01",
                "name": "Togo",
                "code": "TG",
                "currency": "XOF",
                "currency_symbol": "FCFA",
                "timezone": "Africa/Lome"
              }
            ],
            "users": [
              {
                "username": "siege.ci",
                "password": "$HQ_PASSWORD",
                "email": "siege.ci@innovpharma.net",
                "first_name": "Siège",
                "last_name": "CI",
                "role": "admin",
                "countries": [],
                "must_change_password": false,
                "totp_secret": "$HQ_TOTP_SECRET"
              },
              {
                "username": "togo.ci",
                "password": "$COUNTRY_PASSWORD",
                "email": "togo.ci@innovpharma.net",
                "first_name": "Togo",
                "last_name": "CI",
                "role": "manager",
                "countries": ["TG-01"],
                "must_change_password": false,
                "totp_secret": "$COUNTRY_TOTP_SECRET"
              }
            ]
          }
          EOF

      # MinIO se compile depuis ses sources (décision 94), deux à trois
      # minutes : à part, pour que ce temps ne se lise pas comme un
      # démarrage lent de la pile.
      - name: Construire l'image MinIO
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml build minio

      - name: Démarrer la pile
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            up -d --build --wait --wait-timeout 300

      - name: Amorcer les comptes et les données de démonstration
        # Le fichier des comptes n'est pas dans l'image (`.dockerignore`) et
        # aucun code n'est monté dans la pile CI : il entre par `compose cp`,
        # comme sur un serveur (deploy/README.md, « Première mise en
        # service »). `seed_demo` remplit ensuite dossiers, lignes et pièces
        # pour que les captures montrent autre chose que des écrans vides.
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            cp backend/seed_users.ci.json backend:/tmp/seed.json
          docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            exec -T backend python manage.py seed_users --file /tmp/seed.json
          docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            exec -T backend python manage.py seed_demo --base-jetable

      - name: Topologie de production
        # Le navigateur passe par Caddy (HTTP, port 8080) puis nginx, comme
        # en production derrière TLS : le Caddyfile livré est celui qui
        # tourne ici, et Django lit l'adresse du client à travers deux
        # proxys (DJANGO_NUM_PROXIES=2). `/admin/` n'est pas routé vers
        # Django : nginx sert l'application (SPA) pour tout ce qui n'est pas
        # `/api/`, et le back-office Django n'est joignable nulle part.
        run: |
          curl -fsS -o /dev/null -w 'Caddy → nginx → Django : %{http_code}\n' http://localhost:8080/api/health/
          type=$(curl -fsS -o /dev/null -w '%{content_type}' http://localhost:8080/admin/)
          case "$type" in
            text/html*) echo "✔ /admin/ répond l'application (SPA), pas le back-office Django." ;;
            *) echo "::error::/admin/ répond « $type » : nginx ne devrait pas relayer ce chemin." ; exit 1 ;;
          esac

      - name: Captures d'écran
        working-directory: frontend
        env:
          SHOT_BASE: http://localhost:8080
          SHOT_OUT: ${{ runner.temp }}/captures
          SHOT_HQ_USER: siege.ci
          SHOT_COUNTRY_USER: togo.ci
          # Mots de passe et secrets TOTP : posés dans l'environnement du
          # travail par « Générer des comptes jetables », masqués.
          SHOT_HQ_TOTP_SECRET: ${{ env.SHOT_HQ_TOTP_SECRET }}
          SHOT_COUNTRY_TOTP_SECRET: ${{ env.SHOT_COUNTRY_TOTP_SECRET }}
        run: |
          mkdir -p "$SHOT_OUT"
          npx tsx scripts/shot-login.ts
          npx tsx scripts/screenshot.ts
          npx tsx scripts/shot-theme.mts

      - name: Limitation de débit de nginx
        # `frontend/nginx.conf` limite `/api/health/` à 2 requêtes par
        # seconde et par adresse, avec une réserve de 5 (et `/api/` à 40,
        # réserve 80). Cent requêtes lancées d'un coup (50 en parallèle)
        # doivent donc en voir refusées en 429 — et cette réponse doit être
        # le JSON de l'API, pas la page d'erreur de nginx. L'étape vient
        # après les captures pour ne pas les priver de réserve.
        # Derrière Caddy, nginx lit l'adresse réelle dans X-Forwarded-For
        # (`set_real_ip_from`) : la rafale vient d'une seule adresse, celle
        # de l'exécuteur, et doit être limitée comme telle.
        run: |
          codes=$(seq 100 | xargs -P 50 -I{} curl -s -o /dev/null \
            -w '%{http_code} %{content_type}\n' http://localhost:8080/api/health/)
          echo "Réponses obtenues :"
          echo "$codes" | sort | uniq -c
          refusees=$(echo "$codes" | grep -c '^429 application/json' || true)
          if [ "$refusees" -eq 0 ]; then
            echo "::error::Aucune réponse « 429 application/json » sur 100 requêtes rapides vers /api/health/ : la limitation de débit de frontend/nginx.conf ne s'applique pas."
            exit 1
          fi
          echo "✔ ${refusees} requêtes refusées en 429 (JSON), la limitation de débit s'applique."

      - name: Publier les captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: captures-${{ github.sha }}
          path: ${{ runner.temp }}/captures
          if-no-files-found: ignore
          retention-days: 14

      - name: Journaux de la pile
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color

      - name: Arrêter la pile
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v --remove-orphans

  exploitation:
    name: Exploitation — scripts de sauvegarde
    runs-on: ubuntu-latest
    # `sauvegarder.sh` ne tourne nulle part ailleurs dans la CI : il vit
    # dans des conteneurs qui n'existent qu'en production, et son défaut
    # ne se découvrirait qu'une nuit de panne. Ses tests remplacent
    # `pg_dump`, `mc` et `rclone` par des doublures et gardent le vrai
    # `openssl` : ils éprouvent ce qui compte — qu'une sauvegarde ratée
    # ne pose jamais son marqueur de réussite, et qu'un dump chiffré à
    # clé publique se déchiffre bien avec la clé privée.

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Syntaxe des scripts
        run: |
          for script in deploy/*.sh deploy/justi-livrer deploy/tests/*.sh; do
            sh -n "$script" || { echo "::error::$script : syntaxe invalide"; exit 1; }
          done

      - name: shellcheck
        # `sh -n` ne voit qu'une syntaxe invalide. shellcheck voit une variable
        # jamais définie, un `$?` lu après la mauvaise commande, un test
        # toujours vrai — ce qu'un script de sauvegarde ne doit pas cacher
        # jusqu'à la nuit où il sert. Au niveau `error` : les avertissements
        # de style, dans 3 000 lignes de shell, noieraient les vrais.
        run: shellcheck --severity=error deploy/*.sh deploy/justi-livrer deploy/tests/*.sh

      - name: Tests de sauvegarder.sh
        run: sh deploy/tests/test_sauvegarder.sh

      - name: Tests de justi-livrer
        # La commande forcée est le seul verrou entre une livraison et le
        # serveur : une livraison de préproduction ne doit jamais se
        # déployer sur le serveur de production (décision 90).
        run: sh deploy/tests/test_justi_livrer.sh

  pile:
    name: Pile de production — archivage et reprise
    runs-on: ubuntu-latest
    # Le travail « Parcours complet » joue la pile de développement, jamais
    # `deploy/docker-compose.prod.yml`. Trois défauts de la reprise à un
    # instant donné ont vécu là, invisibles à tout test statique et à tout
    # banc sans Docker : un volume que Postgres ne pouvait pas écrire (chaque
    # archivage échouait, les segments s'accumulaient dans `pg_wal`), un
    # script de reprise monté nulle part, un service qui tournait en root
    # là où `pg_ctl` le refuse. Ce travail fait ce qu'un exploitant ferait
    # un jour de sinistre, sur la pile livrée : archiver, sauvegarder,
    # effacer par erreur, revenir à l'instant d'avant, et compter.
    defaults:
      run:
        working-directory: deploy

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configuration factice
        # Ce que `.env.example` exige (`${X:?}`), avec des valeurs sans
        # importance : rien ici ne sert de donnée réelle, et seuls la base,
        # la sauvegarde et la reprise démarrent — les images de
        # l'application ne sont jamais tirées. Les valeurs qui ressemblent à
        # des secrets sont tirées au sort à chaque exécution : un littéral,
        # même factice, déclenche le détecteur de secrets de GitGuardian.
        run: |
          cat > .env <<EOF
          BACKEND_IMAGE=ghcr.io/ci/backend
          FRONTEND_IMAGE=ghcr.io/ci/frontend
          IMAGE_TAG=ci
          APP_DOMAIN=ci.invalid
          ACME_EMAIL=ci@ci.invalid
          APP_BASE_URL=https://ci.invalid
          CORS_ALLOWED_ORIGINS=https://ci.invalid
          DJANGO_ALLOWED_HOSTS=ci.invalid
          DJANGO_SECRET_KEY=$(openssl rand -hex 32)
          DEFAULT_FROM_EMAIL=ci@ci.invalid
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          AWS_ACCESS_KEY_ID=ci-cle
          AWS_SECRET_ACCESS_KEY=$(openssl rand -hex 16)
          GRAFANA_ADMIN_PASSWORD=$(openssl rand -hex 8)
          ADRESSE_PRIVEE=127.0.0.1
          MACHINE_PRIMAIRE=10.0.0.1
          MACHINE_SECONDE=10.0.0.2
          BALANCEUR_RESEAU=10.0.0.0/24
          POSTGRES_ARCHIVE_TIMEOUT=30
          EOF

      - name: La pile s'interpole, dans chacun de ses modes
        run: |
          for fichiers in \
            "docker-compose.prod.yml" \
            "docker-compose.prod.yml -f docker-compose.primaire.yml" \
            "docker-compose.prod.yml -f docker-compose.replique.yml" \
            "docker-compose.prod.yml -f docker-compose.derriere-balanceur.yml" \
            "docker-compose.balanceur.yml"; do
            # shellcheck disable=SC2086
            docker compose -f $fichiers config -q || { echo "::error::$fichiers ne s'interpole pas"; exit 1; }
            echo "✔ $fichiers"
          done

      - name: La base démarre, une fois le volume des sauvegardes préparé
        run: |
          docker compose -f docker-compose.prod.yml up -d db
          for _ in $(seq 60); do
            docker compose -f docker-compose.prod.yml exec -T db pg_isready -U justi -d justi_innov >/dev/null 2>&1 && break
            sleep 2
          done
          docker compose -f docker-compose.prod.yml exec -T db pg_isready -U justi -d justi_innov
          docker compose -f docker-compose.prod.yml ps -a

      - name: Des lignes, puis un segment archivé par la base elle-même
        # `pg_switch_wal` clôt le segment courant ; Postgres appelle alors
        # archiver_wal.sh, sous `postgres`, dans le volume que
        # sauvegardes-init vient de lui donner. C'est le défaut du volume en
        # root qui se verrait ici : `failed_count` monterait, `archived_count`
        # resterait à zéro, et le disque se remplirait en production.
        run: |
          psql() { docker compose -f docker-compose.prod.yml exec -T db psql -v ON_ERROR_STOP=1 -qtAX -U justi -d justi_innov "$@"; }
          psql -c "create table reprise_ci(id int primary key, note text)"
          psql -c "insert into reprise_ci select g, 'ligne ' || g from generate_series(1, 1000) g"
          psql -c "select pg_switch_wal()" >/dev/null
          for _ in $(seq 30); do
            etat="$(psql -c "select archived_count || ' ' || failed_count from pg_stat_archiver")"
            archives="${etat% *}"; echecs="${etat#* }"
            [ "$echecs" -eq 0 ] || { echo "::error::l'archivage a échoué $echecs fois : le volume n'est pas inscriptible par Postgres"; docker compose -f docker-compose.prod.yml logs db; exit 1; }
            [ "$archives" -ge 1 ] && break
            sleep 2
          done
          [ "$archives" -ge 1 ] || { echo "::error::aucun segment archivé en 60 s"; docker compose -f docker-compose.prod.yml logs db; exit 1; }
          echo "✔ $archives segment(s) archivé(s), $echecs échec(s)"
          docker compose -f docker-compose.prod.yml run --rm -T --entrypoint sh sauvegarde -c 'ls -l /sauvegardes/base/wal'

      - name: Sauvegarde physique par le service, sous postgres
        run: |
          # L'entrypoint du service porte déjà « base » : on ne passe que l'option.
          docker compose -f docker-compose.prod.yml run --rm -T sauvegarde --une-fois
          docker compose -f docker-compose.prod.yml run --rm -T --entrypoint sh sauvegarde -c '
            ls -1d /sauvegardes/base/physique/*/ && ls -l /sauvegardes/base/physique/*/base.tar.gz
            [ -f /sauvegardes/.derniere-reussite-base-physique ] || { echo "::error::pas de marqueur base-physique"; exit 1; }
            [ -f /sauvegardes/.distant/demande-wal ] || { echo "::error::aucune demande de copie des segments"; exit 1; }
            [ -f /sauvegardes/.distant/demande-base-physique ] || { echo "::error::aucune demande de copie de la sauvegarde physique"; exit 1; }
          '

      - name: Un effacement par erreur, et la reprise à l'instant d'avant
        # Ce qu'un dump quotidien ne permet pas : revenir à 14:31 pour
        # défaire 14:32. L'instant est pris entre les deux, la base d'essai
        # est ouverte dans le conteneur `reprise`, et la requête compte les
        # lignes telles qu'elles étaient.
        run: |
          psql() { docker compose -f docker-compose.prod.yml exec -T db psql -v ON_ERROR_STOP=1 -qtAX -U justi -d justi_innov "$@"; }
          sleep 2
          instant="$(psql -c "select clock_timestamp()")"
          sleep 2
          psql -c "delete from reprise_ci"
          psql -c "select pg_switch_wal()" >/dev/null
          sleep 5
          echo "instant visé : $instant"
          sortie="$(docker compose -f docker-compose.prod.yml run --rm -T reprise \
            --a "$instant" --requete "select count(*) from reprise_ci" 2>&1)" || { echo "$sortie"; exit 1; }
          echo "$sortie"
          echo "$sortie" | grep -q 'arrêt : ' || { echo "::error::la reprise n'a pas dit où elle s'est arrêtée"; exit 1; }
          echo "$sortie" | grep -qx ' *1000' || { echo "::error::la base rejouée ne contient pas les 1 000 lignes d'avant l'effacement"; exit 1; }
          echo "✔ les 1 000 lignes effacées sont revenues, la pile n'a pas été touchée"

      - name: Journaux de la pile
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs --no-color

      - name: Arrêter la pile
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v --remove-orphans

  audit:
    name: Dépendances vulnérables
    runs-on: ubuntu-latest
    # Bloquant : une dépendance vulnérable ne se livre pas. `npm audit`
    # s'arrête aux avis `high` et `critical` ; `pip-audit` ne gradue pas et
    # échoue sur tout avis connu, ainsi que sur toute dépendance qu'il ne
    # peut pas auditer (`--strict`). Un avis sans correctif disponible se
    # traite par une mise à jour ou, à défaut, par `--ignore-vuln <id>`
    # accompagné d'un commentaire qui dit pourquoi.

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Backend — pip-audit
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit --strict -r requirements.txt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend — npm audit
        working-directory: frontend
        run: npm audit --audit-level=high
