name: Intégration continue

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend — tests Django
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: justi_innov
          POSTGRES_USER: justi
          POSTGRES_PASSWORD: justi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U justi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_DEBUG: "1"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      # Les tests écrivent dans un stockage en mémoire : aucun MinIO requis.
      AWS_S3_ENDPOINT_URL: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Installer les dépendances
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Vérifier que les migrations sont à jour
        working-directory: backend
        # Un modèle modifié sans migration passerait les tests mais casserait
        # le déploiement suivant.
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        working-directory: backend
        run: python manage.py test --verbosity 2

  frontend:
    name: Frontend — types, lint et tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        working-directory: frontend
        run: npm ci

      - name: Typage
        working-directory: frontend
        run: npx tsc -b --force

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Tests
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        run: npm run build
