# Livraison continue : de la poussée sur `main` à la plateforme en ligne.
#
#   main ─────────▶ CI ─▶ images (ghcr.io) ─▶ préproduction (automatique)
#   tag v1.2.3 ───▶ CI ─▶ images (ghcr.io) ─▶ production (après approbation)
#
# Rien ne se déploie qui n'ait passé l'intégration continue : le workflow
# `ci.yml` est appelé ici même, pas simplement supposé vert — et il ne se
# déclenche plus de lui-même sur `main`, sans quoi chaque poussée le ferait
# tourner deux fois. Les images sont construites une fois, étiquetées par le
# SHA du commit (et par le nom du tag, quand il y en a un) ; aucune étiquette
# `latest` n'est publiée : le serveur ne reçoit que l'étiquette exacte, on
# sait toujours quel code tourne, et revenir en arrière consiste à redéployer
# une étiquette précédente.
#
# Le serveur n'a besoin que de Docker. Il reçoit `deploy/` par SSH, se
# connecte au registre avec un jeton qui expire à la fin du travail, tire les
# images et relance la pile ; les migrations s'appliquent au démarrage du
# backend (`backend/entrypoint.sh`). Le déploiement n'est déclaré réussi que
# lorsque tous les conteneurs répondent à leur contrôle de santé et que le
# point `/api/health/` répond publiquement ; sinon `deploy.sh` rétablit
# l'étiquette précédente.
#
# Secrets attendus par environnement (Settings › Environments) :
#   DEPLOY_HOST          hôte SSH
#   DEPLOY_USER          compte SSH de livraison (`deploy`), qui n'est PAS
#                        membre du groupe docker et dont la clé ne peut
#                        exécuter que la commande forcée `justi-livrer`
#                        (deploy/preparer_serveur.sh)
#   DEPLOY_SSH_KEY       clé privée dédiée au déploiement
#   DEPLOY_KNOWN_HOSTS   empreinte du serveur (`ssh-keyscan -H <hôte>`),
#                        obligatoire : relever l'empreinte au premier contact
#                        reviendrait à faire confiance à n'importe qui
# Variables d'environnement (Settings › Environments › Variables) :
#   APP_DOMAIN           domaine public, pour le contrôle final
# Le fichier `.env` du serveur n'est jamais dans le dépôt : `deploy/.env.example`
# en donne le modèle.
#
# La livraison ne copie plus rien sur le serveur : elle lui demande, par la
# commande forcée de sa clé, de déployer une étiquette d'images. Le
# deploy.sh qui s'exécute est celui du répertoire d'exploitation, propriété
# de root, que la clé ne peut pas remplacer ; les fichiers de deploy/ se
# mettent à jour en root, à la main (deploy/README.md, « Réduire les
# pouvoirs de la livraison »). Quiconque pousse sur `main` n'exécute donc
# plus de code en root sur le serveur.
#
# La plateforme tourne sur le serveur Hetzner (deploy/README.md) ; Railway
# reste une voie de repli documentée (`docs/deploiement-railway.md`). La
# publication des images et le déploiement par SSH ne partent que si la
# variable de dépôt `DEPLOIEMENT_SSH` vaut `1` (Settings › Secrets and
# variables › Actions › Variables) — c'est le cas en production.
name: Livraison continue

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: Environnement cible
        type: choice
        options: [staging, production]
        default: staging

# Chaque travail demande ce dont il a besoin, rien de plus (voir les
# `permissions` par travail).
permissions: {}

# Deux livraisons vers le même environnement ne s'entremêlent pas ; une
# livraison en préproduction n'attend pas une livraison en production.
concurrency:
  group: cd-${{ inputs.environment || (startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging') }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  ci:
    name: Intégration continue
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    secrets: inherit

  images:
    name: Construire et publier les images
    needs: ci
    # Sans serveur SSH, rien à publier : Railway construit ses propres images.
    if: vars.DEPLOIEMENT_SSH == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      backend: ${{ steps.noms.outputs.backend }}
      frontend: ${{ steps.noms.outputs.frontend }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Noms des images
        id: noms
        # ghcr.io impose des noms en minuscules ; un dépôt « JUSTI-INNOV »
        # donnerait sinon une image introuvable.
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          base="${REGISTRY}/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "backend=${base}-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=${base}-frontend" >> "$GITHUB_OUTPUT"

      - name: Étiquette déployée
        id: tag
        # Le SHA court identifie le code sans ambiguïté ; le nom du tag,
        # quand il y en a un, sert aux humains. La version affichée dans
        # l'interface (`version`) est celle du tag `v*` sans son « v » ;
        # une livraison de `main` n'en a pas et montre celle du
        # `package.json`, suivie du SHA court pour la distinguer.
        env:
          REF_NAME: ${{ github.ref_name }}
          SUR_UN_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          sha="$(git rev-parse --short=12 HEAD)"
          echo "tag=sha-${sha}" >> "$GITHUB_OUTPUT"
          if [ "$SUR_UN_TAG" = "true" ]; then
            echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            paquet="$(sed -n 's/^  "version": "\(.*\)",$/\1/p' frontend/package.json | head -n 1)"
            echo "version=${paquet}+${sha}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Métadonnées backend
        id: meta_backend
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ steps.noms.outputs.backend }}
          # Pas de `latest` : une étiquette mouvante ne dit pas quel code
          # tourne, et le déploiement ne s'en sert pas.
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.tag.outputs.tag }}
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=Plateforme de contrôle budgétaire — backend

      - name: Métadonnées frontend
        id: meta_frontend
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ steps.noms.outputs.frontend }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.tag.outputs.tag }}
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=Plateforme de contrôle budgétaire — frontend

      - name: Publier l'image backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: backend
          push: true
          tags: ${{ steps.meta_backend.outputs.tags }}
          labels: ${{ steps.meta_backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Publier l'image frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: frontend
          target: runtime
          # La version affichée en pied de page vient d'ici (voir
          # `frontend/Dockerfile`) : un nouveau tag, une nouvelle version,
          # sans rien écrire dans le code.
          build-args: |
            APP_VERSION=${{ steps.tag.outputs.version }}
          push: true
          tags: ${{ steps.meta_frontend.outputs.tags }}
          labels: ${{ steps.meta_frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deployer:
    name: Déployer (${{ inputs.environment || (startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging') }})
    needs: images
    runs-on: ubuntu-latest
    # Le jeton sert au serveur pour tirer les images : lecture du registre,
    # rien d'autre.
    permissions:
      contents: read
      packages: read
    # Les règles de protection (relecteurs obligatoires, branches et tags
    # autorisés) se règlent sur l'environnement GitHub, pas ici : la
    # production attend une approbation et n'accepte que les tags `v*`, la
    # préproduction part seule.
    environment:
      name: ${{ inputs.environment || (startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging') }}
      url: https://${{ vars.APP_DOMAIN }}
    timeout-minutes: 20

    steps:
      - name: Vérifier les valeurs transmises au serveur
        # Ces valeurs finissent dans une ligne de commande distante : chacune
        # est confrontée à une expression régulière stricte, et le travail
        # s'arrête net si l'une d'elles sort du cadre — plutôt que d'espérer
        # qu'un guillemet fasse son office. Le serveur les revérifie de son
        # côté (deploy/justi-livrer), avec les mêmes motifs.
        env:
          IMAGE_TAG: ${{ needs.images.outputs.tag }}
          BACKEND_IMAGE: ${{ needs.images.outputs.backend }}
          FRONTEND_IMAGE: ${{ needs.images.outputs.frontend }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          verifier() {
            nom="$1"; valeur="$2"; motif="$3"
            if ! printf '%s' "$valeur" | grep -Eq "$motif"; then
              echo "✘ $nom invalide ou absent : « $valeur »" >&2
              exit 1
            fi
          }
          verifier IMAGE_TAG      "$IMAGE_TAG"      '^sha-[0-9a-f]{12}$'
          verifier BACKEND_IMAGE  "$BACKEND_IMAGE"  '^ghcr\.io/[a-z0-9._/-]+$'
          verifier FRONTEND_IMAGE "$FRONTEND_IMAGE" '^ghcr\.io/[a-z0-9._/-]+$'
          verifier APP_DOMAIN     "$APP_DOMAIN"     '^[a-z0-9.-]+$'
          # Classe POSIX : `]` en tête et `-` en queue sont littéraux, `\` ne
          # l'est pas — `\]` fermait la classe et le motif exigeait « -] »,
          # ce qu'aucun compte GitHub ne satisfait (livraison v1.0.1).
          verifier GHCR_USER      "$GHCR_USER"      '^[]A-Za-z0-9._[-]+$'
          # Une seule ligne, lue par la commande forcée du serveur : les
          # valeurs viennent d'être bornées, aucune n'a besoin de guillemets.
          echo "livrer $IMAGE_TAG $BACKEND_IMAGE $FRONTEND_IMAGE $APP_DOMAIN $GHCR_USER" > commande

      - name: Préparer l'accès SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_SSH: ${{ secrets.DEPLOY_USER }}
        run: |
          # Chaque variable locale est nommée d'après son secret, pour que le
          # message d'erreur dise exactement ce qu'il faut ajouter dans
          # Settings › Environments.
          for couple in SSH_KEY:DEPLOY_SSH_KEY KNOWN_HOSTS:DEPLOY_KNOWN_HOSTS HOST:DEPLOY_HOST USER_SSH:DEPLOY_USER; do
            nom="${couple%%:*}"; secret="${couple#*:}"
            eval "valeur=\$$nom"
            if [ -z "$valeur" ]; then
              echo "✘ Secret $secret manquant sur l'environnement." >&2
              exit 1
            fi
          done
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # L'empreinte vient du secret, jamais du réseau : `ssh-keyscan` au
          # premier contact accepterait l'empreinte d'un usurpateur.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          {
            echo "Host cible"
            echo "  HostName $HOST"
            echo "  User $USER_SSH"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
            echo "  ConnectTimeout 20"
          } > ~/.ssh/config

      - name: Déployer
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Le jeton du workflow passe par l'entrée standard, jamais par la ligne
        # de commande (visible dans `ps`) ni par un fichier, et n'est plus
        # valable une fois le travail terminé. La commande demandée n'est pas
        # exécutée telle quelle : sshd lance la commande forcée de la clé,
        # qui la relit, la valide et appelle le deploy.sh du serveur.
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh cible "$(cat commande)"

      - name: Contrôle public
        env:
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
        # Le serveur a dit que tout allait bien ; on vérifie depuis l'extérieur
        # que le domaine public — TLS, Caddy, nginx, Django, base — répond.
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --max-time 10 "https://$APP_DOMAIN/api/health/"; then
              echo && echo "✔ $APP_DOMAIN répond."
              exit 0
            fi
            sleep 5
          done
          echo "✘ $APP_DOMAIN ne répond pas sur /api/health/." >&2
          exit 1

      - name: Résumé
        if: success()
        env:
          ENVIRONNEMENT: ${{ inputs.environment || (startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging') }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          IMAGE_TAG: ${{ needs.images.outputs.tag }}
          COMMIT: ${{ github.sha }}
        run: |
          {
            echo "## Déployé"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Environnement | $ENVIRONNEMENT |"
            echo "| Domaine | https://$APP_DOMAIN |"
            echo "| Étiquette | \`$IMAGE_TAG\` |"
            echo "| Commit | \`$COMMIT\` |"
          } >> "$GITHUB_STEP_SUMMARY"
