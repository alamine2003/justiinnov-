# Livraison continue : de la poussée sur `main` à la plateforme en ligne.
#
#   main ─────────▶ CI ─▶ images (ghcr.io) ─▶ préproduction (automatique,
#                                               si PREPRODUCTION vaut 1)
#   tag v1.2.3 ───▶ CI ─▶ images (ghcr.io) ─▶ production (après approbation)
#
# Préproduction et production sont deux serveurs (décision 90). Jusqu'au
# 23 septembre 2026, l'environnement `staging` portait les secrets du
# serveur de production : chaque fusion sur `main` y partait, sans tag ni
# approbation. Désormais, chaque serveur porte une marque (fichier
# ENVIRONNEMENT, propriété de root) et sa commande forcée refuse une
# livraison destinée à l'autre ; la préproduction ne se déploie que si la
# variable de dépôt `PREPRODUCTION` vaut `1`, une fois son serveur prêt.
#
# Rien ne se déploie qui n'ait passé l'intégration continue : le workflow
# `ci.yml` est appelé ici même, pas simplement supposé vert — et il ne se
# déclenche plus de lui-même sur `main`, sans quoi chaque poussée le ferait
# tourner deux fois. Les images sont construites une fois, étiquetées par le
# SHA du commit (et par le nom du tag, quand il y en a un) ; aucune étiquette
# `latest` n'est publiée : le serveur ne reçoit que l'étiquette exacte, on
# sait toujours quel code tourne, et revenir en arrière consiste à redéployer
# une étiquette précédente.
#
# Le serveur n'a besoin que de Docker. Il reçoit `deploy/` par SSH, se
# connecte au registre avec un jeton qui expire à la fin du travail, tire les
# images et relance la pile ; les migrations s'appliquent au démarrage du
# backend (`backend/entrypoint.sh`). Le déploiement n'est déclaré réussi que
# lorsque tous les conteneurs répondent à leur contrôle de santé et que le
# point `/api/health/` répond publiquement ; sinon `deploy.sh` rétablit
# l'étiquette précédente.
#
# Secrets attendus par environnement (Settings › Environments) :
#   DEPLOY_HOST          hôte SSH
#   DEPLOY_USER          compte SSH de livraison (`deploy`), qui n'est PAS
#                        membre du groupe docker et dont la clé ne peut
#                        exécuter que la commande forcée `justi-livrer`
#                        (deploy/preparer_serveur.sh)
#   DEPLOY_SSH_KEY       clé privée dédiée au déploiement
#   DEPLOY_KNOWN_HOSTS   empreinte du serveur (`ssh-keyscan -H <hôte>`),
#                        obligatoire : relever l'empreinte au premier contact
#                        reviendrait à faire confiance à n'importe qui
# Variables d'environnement (Settings › Environments › Variables) :
#   APP_DOMAIN           domaine public, pour le contrôle final — un
#                        domaine par environnement, jamais le même
# Le fichier `.env` du serveur n'est jamais dans le dépôt : `deploy/.env.example`
# en donne le modèle.
#
# La livraison ne copie plus rien sur le serveur : elle lui demande, par la
# commande forcée de sa clé, de déployer une étiquette d'images. Le
# deploy.sh qui s'exécute est celui du répertoire d'exploitation, propriété
# de root, que la clé ne peut pas remplacer ; les fichiers de deploy/ se
# mettent à jour en root, à la main (deploy/README.md, « Réduire les
# pouvoirs de la livraison »). Quiconque pousse sur `main` n'exécute donc
# plus de code en root sur le serveur.
#
# Un échec de livraison ouvre un ticket sur le dépôt (travail `alerte`) :
# une pull request fusionnée ne dit rien de ce qui se passe après elle, et
# personne ne regarde l'onglet Actions. Le ticket se commente aux échecs
# suivants et se referme quand une livraison repasse.
#
# La plateforme tourne sur le serveur Hetzner (deploy/README.md) ; Railway
# reste une voie de repli documentée (`docs/deploiement-railway.md`). La
# publication des images et le déploiement par SSH ne partent que si la
# variable de dépôt `DEPLOIEMENT_SSH` vaut `1` (Settings › Secrets and
# variables › Actions › Variables) — c'est le cas en production.
name: Livraison continue

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: Environnement cible
        type: choice
        options: [staging, production]
        default: staging

# Chaque travail demande ce dont il a besoin, rien de plus (voir les
# `permissions` par travail).
permissions: {}

# Deux livraisons vers le même environnement ne s'entremêlent pas ; une
# livraison en préproduction n'attend pas une livraison en production.
concurrency:
  group: cd-${{ inputs.environment || (startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging') }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  ci:
    name: Intégration continue
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    secrets: inherit

  images:
    name: Construire et publier les images
    needs: ci
    # Sans serveur SSH, rien à publier : Railway construit ses propres images.
    if: vars.DEPLOIEMENT_SSH == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      backend: ${{ steps.noms.outputs.backend }}
      frontend: ${{ steps.noms.outputs.frontend }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Noms des images
        id: noms
        # ghcr.io impose des noms en minuscules ; un dépôt « JUSTI-INNOV »
        # donnerait sinon une image introuvable.
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          base="${REGISTRY}/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "backend=${base}-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=${base}-frontend" >> "$GITHUB_OUTPUT"
          echo "minio=${base}-minio" >> "$GITHUB_OUTPUT"

      - name: Étiquette déployée
        id: tag
        # Le SHA court identifie le code sans ambiguïté ; le nom du tag,
        # quand il y en a un, sert aux humains. La version affichée dans
        # l'interface (`version`) est celle du tag `v*` sans son « v » ;
        # une livraison de `main` n'en a pas et montre celle du
        # `package.json`, suivie du SHA court pour la distinguer.
        env:
          REF_NAME: ${{ github.ref_name }}
          SUR_UN_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          sha="$(git rev-parse --short=12 HEAD)"
          echo "tag=sha-${sha}" >> "$GITHUB_OUTPUT"
          if [ "$SUR_UN_TAG" = "true" ]; then
            echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            paquet="$(sed -n 's/^  "version": "\(.*\)",$/\1/p' frontend/package.json | head -n 1)"
            echo "version=${paquet}+${sha}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Métadonnées backend
        id: meta_backend
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.noms.outputs.backend }}
          # Pas de `latest` : une étiquette mouvante ne dit pas quel code
          # tourne, et le déploiement ne s'en sert pas.
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.tag.outputs.tag }}
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=Plateforme de contrôle budgétaire — backend

      - name: Métadonnées frontend
        id: meta_frontend
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.noms.outputs.frontend }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.tag.outputs.tag }}
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=Plateforme de contrôle budgétaire — frontend

      - name: Publier l'image backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          push: true
          tags: ${{ steps.meta_backend.outputs.tags }}
          labels: ${{ steps.meta_backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Publier l'image frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          target: runtime
          # La version affichée en pied de page vient d'ici (voir
          # `frontend/Dockerfile`) : un nouveau tag, une nouvelle version,
          # sans rien écrire dans le code.
          build-args: |
            APP_VERSION=${{ steps.tag.outputs.version }}
          push: true
          tags: ${{ steps.meta_frontend.outputs.tags }}
          labels: ${{ steps.meta_frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      # MinIO ne publie plus d'images : la nôtre se construit depuis les
      # sources (deploy/minio/Dockerfile, décision 94). Son étiquette est
      # celle que nomme docker-compose.prod.yml, et elle ne se republie
      # jamais : reconstruite, l'image changerait d'empreinte et le serveur
      # recréerait le conteneur des justificatifs à chaque livraison.
      - name: Image MinIO — déjà publiée ?
        id: minio
        env:
          ATTENDU: ${{ steps.noms.outputs.minio }}
        run: |
          image="$(sed -n 's/^ *image: \(ghcr\.io\/[^ ]*-minio:[^ ]*\)$/\1/p' deploy/docker-compose.prod.yml | sort -u)"
          if [ -z "$image" ] || [ "$(printf '%s\n' "$image" | wc -l)" -ne 1 ]; then
            echo "::error::docker-compose.prod.yml doit nommer une seule image MinIO, pas « $image »"
            exit 1
          fi
          # Le nom est écrit en dur dans les fichiers Compose : un dépôt
          # renommé publierait ailleurs que là où le serveur tire.
          if [ "${image%%:*}" != "$ATTENDU" ]; then
            echo "::error::docker-compose.prod.yml tire ${image%%:*}, la livraison publie $ATTENDU"
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          if sortie="$(docker buildx imagetools inspect "$image" 2>&1)"; then
            echo "✔ $image déjà publiée : rien à reconstruire."
            echo "publier=non" >> "$GITHUB_OUTPUT"
          # Un paquet qui n'existe pas encore peut répondre « denied » plutôt
          # que « not found » : on publie, et la poussée dira si le droit
          # d'écrire manque vraiment.
          elif printf '%s' "$sortie" | grep -qiE 'not found|manifest unknown|denied|unauthorized'; then
            echo "→ $image absente du registre : elle sera construite."
            echo "publier=oui" >> "$GITHUB_OUTPUT"
          else
            echo "::error::registre illisible pour $image : $sortie"
            exit 1
          fi

      - name: Publier l'image MinIO
        if: steps.minio.outputs.publier == 'oui'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/minio
          push: true
          tags: ${{ steps.minio.outputs.image }}
          # Ce label rattache le paquet au dépôt : c'est ce qui permet au
          # jeton de la livraison, côté serveur, de le lire.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=MinIO et mc, construits depuis les sources
          cache-from: type=gha,scope=minio
          cache-to: type=gha,scope=minio,mode=max

  deployer:
    name: Déployer (${{ inputs.environment || (startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging') }})
    needs: images
    # La préproduction a son propre serveur (décision 90) : tant qu'il
    # n'existe pas, `PREPRODUCTION` n'est pas à 1 et `main` ne se déploie
    # nulle part — le travail est sauté, ce qui n'ouvre aucun ticket. La
    # production, elle, part toujours d'un tag, après approbation.
    if: >-
      (inputs.environment || (startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging')) == 'production'
      || vars.PREPRODUCTION == '1'
    runs-on: ubuntu-latest
    # Le jeton sert au serveur pour tirer les images : lecture du registre,
    # rien d'autre.
    permissions:
      contents: read
      packages: read
    # Les règles de protection (relecteurs obligatoires, branches et tags
    # autorisés) se règlent sur l'environnement GitHub, pas ici : la
    # production attend une approbation et n'accepte que les tags `v*`, la
    # préproduction part seule.
    environment:
      name: ${{ inputs.environment || (startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging') }}
      url: https://${{ vars.APP_DOMAIN }}
    timeout-minutes: 20

    steps:
      - name: Vérifier les valeurs transmises au serveur
        # Ces valeurs finissent dans une ligne de commande distante : chacune
        # est confrontée à une expression régulière stricte, et le travail
        # s'arrête net si l'une d'elles sort du cadre — plutôt que d'espérer
        # qu'un guillemet fasse son office. Le serveur les revérifie de son
        # côté (deploy/justi-livrer), avec les mêmes motifs.
        env:
          IMAGE_TAG: ${{ needs.images.outputs.tag }}
          BACKEND_IMAGE: ${{ needs.images.outputs.backend }}
          FRONTEND_IMAGE: ${{ needs.images.outputs.frontend }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          GHCR_USER: ${{ github.actor }}
          ENVIRONNEMENT: ${{ inputs.environment || (startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging') }}
        run: |
          verifier() {
            nom="$1"; valeur="$2"; motif="$3"
            if ! printf '%s' "$valeur" | grep -Eq "$motif"; then
              echo "✘ $nom invalide ou absent : « $valeur »" >&2
              exit 1
            fi
          }
          verifier IMAGE_TAG      "$IMAGE_TAG"      '^sha-[0-9a-f]{12}$'
          verifier BACKEND_IMAGE  "$BACKEND_IMAGE"  '^ghcr\.io/[a-z0-9._/-]+$'
          verifier FRONTEND_IMAGE "$FRONTEND_IMAGE" '^ghcr\.io/[a-z0-9._/-]+$'
          verifier APP_DOMAIN     "$APP_DOMAIN"     '^[a-z0-9.-]+$'
          # Classe POSIX : `]` en tête et `-` en queue sont littéraux, `\` ne
          # l'est pas — `\]` fermait la classe et le motif exigeait « -] »,
          # ce qu'aucun compte GitHub ne satisfait (livraison v1.0.1).
          verifier GHCR_USER      "$GHCR_USER"      '^[]A-Za-z0-9._[-]+$'
          # Le serveur compare cet environnement à sa propre marque et
          # refuse l'autre (deploy/justi-livrer, décision 90).
          verifier ENVIRONNEMENT  "$ENVIRONNEMENT"  '^(staging|production)$'
          # Une seule ligne, lue par la commande forcée du serveur : les
          # valeurs viennent d'être bornées, aucune n'a besoin de guillemets.
          echo "livrer $IMAGE_TAG $BACKEND_IMAGE $FRONTEND_IMAGE $APP_DOMAIN $GHCR_USER $ENVIRONNEMENT" > commande

      - name: Préparer l'accès SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_SSH: ${{ secrets.DEPLOY_USER }}
        run: |
          # Chaque variable locale est nommée d'après son secret, pour que le
          # message d'erreur dise exactement ce qu'il faut ajouter dans
          # Settings › Environments.
          for couple in SSH_KEY:DEPLOY_SSH_KEY KNOWN_HOSTS:DEPLOY_KNOWN_HOSTS HOST:DEPLOY_HOST USER_SSH:DEPLOY_USER; do
            nom="${couple%%:*}"; secret="${couple#*:}"
            eval "valeur=\$$nom"
            if [ -z "$valeur" ]; then
              echo "✘ Secret $secret manquant sur l'environnement." >&2
              exit 1
            fi
          done
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # L'empreinte vient du secret, jamais du réseau : `ssh-keyscan` au
          # premier contact accepterait l'empreinte d'un usurpateur.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          {
            echo "Host cible"
            echo "  HostName $HOST"
            echo "  User $USER_SSH"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
            echo "  ConnectTimeout 20"
          } > ~/.ssh/config

      - name: Déployer
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Le jeton du workflow passe par l'entrée standard, jamais par la ligne
        # de commande (visible dans `ps`) ni par un fichier, et n'est plus
        # valable une fois le travail terminé. La commande demandée n'est pas
        # exécutée telle quelle : sshd lance la commande forcée de la clé,
        # qui la relit, la valide et appelle le deploy.sh du serveur.
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh cible "$(cat commande)"

      - name: Contrôle public
        env:
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
        # Le serveur a dit que tout allait bien ; on vérifie depuis l'extérieur
        # que le domaine public — TLS, Caddy, nginx, Django, base — répond.
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --max-time 10 "https://$APP_DOMAIN/api/health/"; then
              echo && echo "✔ $APP_DOMAIN répond."
              exit 0
            fi
            sleep 5
          done
          echo "✘ $APP_DOMAIN ne répond pas sur /api/health/." >&2
          exit 1

      - name: Résumé
        if: success()
        env:
          ENVIRONNEMENT: ${{ inputs.environment || (startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging') }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          IMAGE_TAG: ${{ needs.images.outputs.tag }}
          COMMIT: ${{ github.sha }}
        run: |
          {
            echo "## Déployé"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Environnement | $ENVIRONNEMENT |"
            echo "| Domaine | https://$APP_DOMAIN |"
            echo "| Étiquette | \`$IMAGE_TAG\` |"
            echo "| Commit | \`$COMMIT\` |"
          } >> "$GITHUB_STEP_SUMMARY"


  alerte:
    name: Signaler l'état de la livraison
    needs: [ci, images, deployer]
    # Un échec de livraison ne se voyait nulle part : la pull request était
    # déjà fusionnée, personne ne regardait l'onglet Actions, et la
    # préproduction est restée une nuit entière sur une version périmée sans
    # que quiconque l'apprenne. Ce travail ouvre un ticket quand la livraison
    # casse, le commente à chaque nouvel échec plutôt que d'en ouvrir un
    # second, et le referme dès qu'une livraison repasse. Il se tait sur une
    # livraison annulée, et quand le déploiement est hors circuit
    # (`DEPLOIEMENT_SSH`) : un travail sauté n'est pas un échec.
    if: >-
      always() && (contains(needs.*.result, 'failure')
      || needs.deployer.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write

    steps:
      - name: Ouvrir, commenter ou refermer le ticket de livraison
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.api_url }}/repos/${{ github.repository }}
          ENVIRONNEMENT: ${{ inputs.environment || (startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging') }}
          EXECUTION: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT: ${{ github.sha }}
          RESULTAT_CI: ${{ needs.ci.result }}
          RESULTAT_IMAGES: ${{ needs.images.result }}
          RESULTAT_DEPLOIEMENT: ${{ needs.deployer.result }}
        run: |
          set -euo pipefail

          api() {
            curl -sS --fail-with-body \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" "$@"
          }

          commenter() {
            api -X POST "$API/issues/$1/comments" \
              -d "$(jq -n --arg body "$2" '{body: $body}')" > /dev/null
          }

          # Le marqueur est invisible dans le ticket rendu : c'est lui, et non
          # le titre, qui rattache un échec au ticket déjà ouvert pour le même
          # environnement. Deux environnements ont donc deux tickets.
          marqueur="<!-- livraison-echec:$ENVIRONNEMENT -->"

          # Un ticket ouvert porte-t-il déjà ce marqueur ? La recherche globale
          # est indexée avec du retard ; la liste des tickets du dépôt, non.
          # Elle mêle tickets et pull requests : les secondes sont écartées.
          numero=$(api "$API/issues?state=open&per_page=100" | jq -r \
            --arg m "$marqueur" '
              [ .[]
                | select(.pull_request == null)
                | select((.body // "") | contains($m))
              ] | first | .number // empty')

          if [ "$RESULTAT_DEPLOIEMENT" = success ]; then
            if [ -z "$numero" ]; then
              echo "✔ Livraison réussie, aucun ticket à refermer."
              exit 0
            fi
            commenter "$numero" "$(printf '%s\n' \
              "✔ Livraison rétablie en **$ENVIRONNEMENT** sur \`$COMMIT\`." \
              "" \
              "[Voir l'exécution]($EXECUTION)")"
            api -X PATCH "$API/issues/$numero" \
              -d '{"state": "closed", "state_reason": "completed"}' > /dev/null
            echo "✔ Ticket #$numero refermé."
            exit 0
          fi

          echecs=""
          for travail in "Intégration continue:$RESULTAT_CI" \
                         "Images:$RESULTAT_IMAGES" \
                         "Déploiement:$RESULTAT_DEPLOIEMENT"; do
            [ "${travail##*:}" = failure ] || continue
            echecs="$echecs$(printf '\n- %s' "${travail%%:*}")"
          done

          detail=$(printf '%s\n' \
            "**Environnement** : $ENVIRONNEMENT" \
            "**Commit** : \`$COMMIT\`" \
            "**Travaux en échec** :$echecs" \
            "" \
            "[Voir l'exécution]($EXECUTION)")

          if [ -n "$numero" ]; then
            commenter "$numero" "$(printf '%s\n' "✘ Nouvel échec." "" "$detail")"
            echo "✘ Échec ajouté au ticket #$numero."
            exit 0
          fi

          corps=$(printf '%s\n' "$marqueur" "$detail" "" \
            "Ce ticket se referme de lui-même dès qu'une livraison repasse vers cet environnement.")
          ouvert=$(api -X POST "$API/issues" -d "$(jq -n \
            --arg title "Livraison en échec ($ENVIRONNEMENT)" \
            --arg body "$corps" '{title: $title, body: $body}')")
          echo "✘ Ticket #$(printf '%s' "$ouvert" | jq -r .number) ouvert."
