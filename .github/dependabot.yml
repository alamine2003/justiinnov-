# Mises à jour de dépendances proposées en PR, donc vérifiées par la CI
# avant d'être fusionnées. Groupées par écosystème pour ne pas noyer la
# liste des PR sous des bosses de version. Un groupe ne rassemble que les
# versions mineures et correctives : une version majeure arrive seule, pour
# qu'elle ne fasse pas échouer — et donc bloquer — tout le reste du lot
# (lot du 25 septembre 2026 : Django 6, TypeScript 7 et Vitest 5 mêlés à des
# correctifs, CI rouge, rien n'a pu passer).
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Africa/Dakar
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Django 5.2 est une version à support long (correctifs de sécurité
    # jusqu'en avril 2028). Passer à Django 6 est un chantier décidé, pas une
    # bosse de version : on ne le propose pas.
    ignore:
      - dependency-name: django
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "Met à jour"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Africa/Dakar
    groups:
      javascript:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript 7 (compilateur réécrit en Go) n'expose plus l'API
      # JavaScript `ts.factory` dont openapi-typescript tire les types
      # d'API (`npm run types:api`) : la CI casse dès l'installation (#73,
      # 27 septembre 2026). À rouvrir quand openapi-typescript le suivra.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Les types de Node suivent la version qui tourne, Node 24
      # (frontend/Dockerfile, CI) : des types de Node 26 annonceraient des
      # API absentes. Ils changent de majeure avec Node, pas avant.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "Met à jour"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "Met à jour"

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly
    commit-message:
      prefix: "Met à jour"

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: monthly
    commit-message:
      prefix: "Met à jour"

  # L'image MinIO construite chez nous (décision 94) : Go et Alpine y
  # vieillissent comme ailleurs. Une telle mise à jour change l'image, donc
  # son étiquette dans les fichiers Compose — la PR ne passe la CI qu'une
  # fois l'étiquette relevée à la main.
  - package-ecosystem: docker
    directory: /deploy/minio
    schedule:
      interval: monthly
    commit-message:
      prefix: "Met à jour"

  # Les images tierces de la pile de production (Postgres, Redis,
  # Caddy, rclone, Prometheus, Grafana) ne vivent dans aucun Dockerfile :
  # sans cette entrée, un correctif de sécurité de Postgres 16 n'était
  # signalé à personne.
  - package-ecosystem: docker-compose
    directories:
      - /deploy
      - /
    schedule:
      interval: monthly
    # Changer de version majeure de Postgres ne se fait pas en changeant
    # l'image : les fichiers de la base ne se relisent pas d'une majeure à
    # l'autre (sauvegarde puis restauration, ou pg_upgrade), et la réplique,
    # l'archivage et la reprise à un instant donné suivent. Dependabot propose
    # donc les versions correctives de la 16, qui se posent par un simple
    # redémarrage.
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "Met à jour"

