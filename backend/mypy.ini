# Typage du backend (décision 130), rejoué par la CI.
#
# Le code de l'application est vérifié en entier, corps des fonctions non
# annotées compris (`check_untyped_defs`) : au niveau par défaut, mypy saute
# le corps de toute fonction sans annotation, c'est-à-dire presque tout ce
# dépôt, et un passage vert n'aurait rien vérifié.
#
# Hors périmètre, à dessein : les tests (`*/tests/`), où les réponses du
# client de test (`response.data`) font l'essentiel des 3 259 erreurs
# mesurées, et les migrations, générées. Le reste ne s'ignore qu'erreur par
# erreur, code nommé et raison écrite à côté.
[mypy]
python_version = 3.12
plugins = mypy_django_plugin.main, mypy_drf_plugin.main
check_untyped_defs = True
ignore_missing_imports = True
warn_unused_ignores = True
exclude = (^\.venv/|/migrations/|/tests/|^media/)

[mypy.plugins.django-stubs]
django_settings_module = config.settings
