services:
  db:
    image: postgres:18.6-alpine
    container_name: justi_db
    environment:
      POSTGRES_DB: justi_innov
      POSTGRES_USER: justi
      POSTGRES_PASSWORD: justi
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U justi"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Les ports ne sont ouverts que sur la boucle locale : une machine de
    # développement sur un réseau partagé n'expose ni sa base ni son stockage.
    ports:
      - "127.0.0.1:5433:5432"

  redis:
    # Cache principal (config/settings.py). Sans lui la plateforme tourne
    # quand même — la base de données reprend le rôle —, mais chaque lecture
    # d'API réécrit alors le compteur de limitation de débit dans Postgres :
    # 1,5 ko de journal d'écriture par GET, mesuré.
    image: redis:7.4-alpine
    container_name: justi_redis
    # Aucune persistance : un cache perdu se reconstruit, et un cache qu'on
    # sauvegarde coûte des écritures pour rien. L'éviction se fait sur la
    # clé la moins récemment utilisée — un compteur qu'on vient de toucher
    # est donc le dernier à partir, contrairement à la purge par ordre
    # alphabétique de `DatabaseCache` (décision 69).
    command: >
      redis-server --save "" --appendonly no
      --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:6379:6379"

  minio:
    # MinIO ne publie plus d'images (décision 94) : celle-ci se construit
    # depuis les sources, `deploy/minio/Dockerfile`, aux mêmes versions
    # qu'en production. Elle ne se tire jamais d'un registre ici : la
    # production la reçoit de ghcr.io, sous la même étiquette.
    build: ./deploy/minio
    image: ghcr.io/alamine2003/justiinnov--minio:RELEASE.2025-04-22T22-12-26Z-5c7b4d5b5aab
    pull_policy: build
    container_name: justi_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: justi
      MINIO_ROOT_PASSWORD: justi-minio-dev
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  backend:
    build: ./backend
    container_name: justi_backend
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: justi_innov
      POSTGRES_USER: justi
      POSTGRES_PASSWORD: justi
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "*"
      # Les comptes réels sont créés par `manage.py seed_users`.
      DJANGO_CREATE_SUPERUSER: "0"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173"
      # Stockage des pièces justificatives
      AWS_S3_ENDPOINT_URL: "http://minio:9000"
      AWS_ACCESS_KEY_ID: "justi"
      AWS_SECRET_ACCESS_KEY: "justi-minio-dev"
      AWS_STORAGE_BUCKET_NAME: "justificatifs"
      # Cache principal. Retirez cette ligne et la base de données reprend
      # le rôle : la pile démarre sans Redis.
      REDIS_URL: "redis://redis:6379/0"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  scheduler:
    # Les alertes et les rapports étaient documentés comme des lignes de
    # crontab à poser sur l'hôte — donc jamais posées. Ils tournent ici, dans
    # leur propre conteneur : les lancer dans le backend les exécuterait une
    # fois par worker gunicorn, soit autant de notifications pour une alerte.
    build: ./backend
    container_name: justi_scheduler
    entrypoint: ["python", "manage.py", "run_scheduler"]
    # L'image hérite du contrôle de santé du backend, qui interroge l'API sur
    # le port 8000 : l'ordonnanceur n'y répond pas et serait déclaré mort.
    # Le sien lit le battement de cœur que `run_scheduler` touche chaque
    # minute (core/management/commands/run_scheduler.py) : plus de trois
    # minutes sans battement, la boucle est bloquée. Le désactiver n'est pas
    # une option : `docker compose up --wait` refuse un service sans contrôle
    # de santé, et la livraison s'arrêtait là.
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(0 if time.time() - os.stat('/tmp/scheduler.battement').st_mtime < 180 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: justi_innov
      POSTGRES_USER: justi
      POSTGRES_PASSWORD: justi
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "*"
      AWS_S3_ENDPOINT_URL: "http://minio:9000"
      AWS_ACCESS_KEY_ID: "justi"
      AWS_SECRET_ACCESS_KEY: "justi-minio-dev"
      AWS_STORAGE_BUCKET_NAME: "justificatifs"
      # Le même cache que le serveur, et ce n'est pas un détail : la
      # configuration du circuit y est gardée sans expiration, et c'est le
      # serveur qui l'invalide quand elle change. Deux caches distincts
      # laisseraient l'ordonnanceur notifier selon une politique périmée,
      # indéfiniment.
      REDIS_URL: "redis://redis:6379/0"
      # Cadences surchargeables sans reconstruire l'image.
      SCHEDULE_EMAILS: "*/5 * * * *"
      SCHEDULE_SUPPRESSIONS: "*/5 * * * *"
      SCHEDULE_ALERTS: "0 * * * *"
      SCHEDULE_WEEKLY_REPORT: "0 7 * * 1"
      SCHEDULE_MONTHLY_REPORT: "0 7 1 * *"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      # En développement, Vite sert le code monté en volume : il faut Node,
      # pas l'image nginx de production, qui n'a pas npm.
      target: deps
    container_name: justi_frontend
    command: sh -c "npm install && npm run dev"
    environment:
      VITE_PROXY_TARGET: "http://backend:8000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5173:5173"

volumes:
  pgdata:
  miniodata:
  frontend_node_modules: