services:
  db:
    image: postgres:16-alpine
    container_name: justi_db
    environment:
      POSTGRES_DB: justi_innov
      POSTGRES_USER: justi
      POSTGRES_PASSWORD: justi
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U justi"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5432"

  backend:
    build: ./backend
    container_name: justi_backend
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: justi_innov
      POSTGRES_USER: justi
      POSTGRES_PASSWORD: justi
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "*"
      DJANGO_CREATE_SUPERUSER: "1"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: justi_frontend
    command: sh -c "npm install && npm run dev"
    environment:
      VITE_PROXY_TARGET: "http://backend:8000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  pgdata:
  frontend_node_modules: