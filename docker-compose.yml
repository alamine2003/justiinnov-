services:
  db:
    image: postgres:16-alpine
    container_name: justi_db
    environment:
      POSTGRES_DB: justi_innov
      POSTGRES_USER: justi
      POSTGRES_PASSWORD: justi
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U justi"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5432"

  minio:
    image: minio/minio:latest
    container_name: justi_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: justi
      MINIO_ROOT_PASSWORD: justi-minio-dev
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "9000:9000"
      - "9001:9001"

  backend:
    build: ./backend
    container_name: justi_backend
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: justi_innov
      POSTGRES_USER: justi
      POSTGRES_PASSWORD: justi
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "*"
      # Les comptes réels sont créés par `manage.py seed_users`.
      DJANGO_CREATE_SUPERUSER: "0"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173"
      # Stockage des pièces justificatives
      AWS_S3_ENDPOINT_URL: "http://minio:9000"
      AWS_ACCESS_KEY_ID: "justi"
      AWS_SECRET_ACCESS_KEY: "justi-minio-dev"
      AWS_STORAGE_BUCKET_NAME: "justificatifs"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      # En développement, Vite sert le code monté en volume : il faut Node,
      # pas l'image nginx de production, qui n'a pas npm.
      target: deps
    container_name: justi_frontend
    command: sh -c "npm install && npm run dev"
    environment:
      VITE_PROXY_TARGET: "http://backend:8000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  pgdata:
  miniodata:
  frontend_node_modules: