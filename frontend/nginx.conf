# Derrière un point d'entrée TLS (Caddy en production), le schéma vu par
# nginx est toujours « http » : transmettre `$scheme` ferait croire à Django
# qu'il est appelé en clair, et sa redirection HTTPS bouclerait à l'infini.
# On relaie donc l'en-tête reçu quand il existe, et le schéma réel sinon —
# en développement, où le navigateur parle directement à nginx.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    "~^https?$" $http_x_forwarded_proto;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Durcissement : l'application n'embarque aucun script ni style distant,
    # tout est servi depuis cette origine.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
        always;

    # SPA : fallback pour le routage côté client
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Résolveur DNS interne de Docker, interrogé à la volée.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Proxy vers l'API backend (service docker "backend").
    #
    # L'hôte passe par une variable à dessein : avec un nom écrit en dur,
    # nginx le résout au démarrage et **refuse de démarrer** si le backend
    # n'est pas encore joignable. Un simple redémarrage de l'API emporterait
    # alors le frontend avec lui.
    location /api/ {
        set $api_upstream "http://backend:8000";
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # Un justificatif peut peser 20 Mo (MAX_PROOF_SIZE côté Django).
        client_max_body_size 25m;
    }

    # État du conteneur, pour Docker : nginx répond, c'est tout ce qu'on
    # lui demande. La santé de l'API se lit sur /api/health/.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}