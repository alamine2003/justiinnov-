# Derrière un point d'entrée TLS (Caddy en production), le schéma vu par
# nginx est toujours « http » : transmettre `$scheme` ferait croire à Django
# qu'il est appelé en clair, et sa redirection HTTPS bouclerait à l'infini.
# On relaie donc l'en-tête reçu quand il existe, et le schéma réel sinon —
# en développement, où le navigateur parle directement à nginx.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    "~^https?$" $http_x_forwarded_proto;
}

# Limitation de débit sur l'API, par adresse cliente : 20 requêtes par
# seconde en régime établi, avec une réserve de 40 pour absorber l'ouverture
# d'une page (qui charge plusieurs ressources d'un coup) sans faire attendre
# (`nodelay`). Au-delà, nginx répond 429 sans solliciter Django. Django garde
# sa propre limite, plus stricte, sur l'obtention du jeton. Derrière Caddy,
# `$binary_remote_addr` est l'adresse de Caddy pour tout le monde : la
# directive `set_real_ip_from` plus bas rétablit celle du client.
limit_req_zone $binary_remote_addr zone=api_par_adresse:10m rate=20r/s;
limit_req_status 429;

# Les en-têtes de sécurité sont répétés dans chaque bloc `location` qui pose
# son propre `add_header` : dans nginx, un `add_header` local **annule** tous
# ceux du niveau supérieur, silencieusement. Une modification se fait donc
# aux cinq endroits (serveur, /assets/, index.html, fichiers du service
# worker, réponse 429), ou pas du tout.
#
# La politique de sécurité de contenu : aucun script ni style distant ; le
# script anti-flash du thème est un fichier (`public/theme-init.js`), pas un
# bloc en ligne, pour rester sous `script-src 'self'`. `blob:` sert à
# l'aperçu des justificatifs, téléchargés par l'API authentifiée puis
# affichés depuis la mémoire du navigateur (image ou PDF dans un cadre).
# `worker-src` et `manifest-src` couvrent le service worker et le manifeste
# de l'application installable.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self'; worker-src 'self'; manifest-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
        always;

    # Compression des réponses textuelles. Les polices woff2 et les images
    # sont déjà compressées : les recompresser coûte du processeur pour rien.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # SPA : fallback pour le routage côté client
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Les fichiers construits par Vite portent une empreinte dans leur nom :
    # un contenu différent a un nom différent, on peut donc les garder un an.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self'; worker-src 'self'; manifest-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
            always;
    }

    # index.html, lui, référence ces empreintes : le navigateur doit le
    # revalider à chaque visite, sinon il servirait une interface qui pointe
    # vers des fichiers disparus après une livraison.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self'; worker-src 'self'; manifest-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
            always;
    }

    # Application installable : le service worker, ses modules workbox et le
    # manifeste ne portent pas d'empreinte dans leur nom. Le navigateur doit
    # les revalider à chaque fois, sinon une livraison ne serait jamais vue
    # par les postes qui ont installé l'application.
    location ~ ^/(sw\.js|registerSW\.js|workbox-[A-Za-z0-9_-]+\.js|manifest\.webmanifest)$ {
        try_files $uri =404;
        types {
            application/javascript js;
            application/manifest+json webmanifest;
        }
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self'; worker-src 'self'; manifest-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
            always;
    }

    # Résolveur DNS interne de Docker, interrogé à la volée.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Derrière Caddy, la connexion vient toujours de lui : sans ceci, la
    # limitation de débit compterait tous les utilisateurs comme une seule
    # adresse. Seuls les réseaux privés (ceux de Docker) sont crus ; en
    # développement et en CI, où le navigateur parle directement à nginx,
    # l'en-tête est absent et l'adresse réelle reste celle de la connexion.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Proxy vers l'API backend (service docker "backend").
    #
    # L'hôte passe par une variable à dessein : avec un nom écrit en dur,
    # nginx le résout au démarrage et **refuse de démarrer** si le backend
    # n'est pas encore joignable. Un simple redémarrage de l'API emporterait
    # alors le frontend avec lui.
    location /api/ {
        limit_req zone=api_par_adresse burst=40 nodelay;
        # Réponse 429 lisible par l'interface, dans le format de l'API.
        error_page 429 = @trop_de_requetes;

        set $api_upstream "http://backend:8000";
        proxy_pass $api_upstream;
        # HTTP/1.1 sans en-tête `Connection: close` vers gunicorn : une
        # connexion peut servir plusieurs requêtes. Un bloc `upstream` avec
        # `keepalive` serait plus complet, mais il est incompatible avec le
        # `proxy_pass` par variable ci-dessus, qui est là pour une raison.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # Un justificatif peut peser 20 Mo (MAX_PROOF_SIZE côté Django).
        client_max_body_size 25m;
        # Exports et téléchargements de pièces : au moins le délai de gunicorn.
        proxy_read_timeout 120s;
    }

    # Réponse de la limitation de débit : JSON en français, comme les erreurs
    # de l'API, pour que l'interface puisse l'afficher telle quelle.
    location @trop_de_requetes {
        default_type application/json;
        add_header Retry-After "1" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self'; worker-src 'self'; manifest-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
            always;
        return 429 '{"detail":"Trop de requêtes : réessayez dans quelques instants."}';
    }

    # État du conteneur, pour Docker : nginx répond, c'est tout ce qu'on
    # lui demande. La santé de l'API se lit sur /api/health/.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
